/* ===== helpers ===== */
const fmt=n=>"\u20B9"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});  // up to 2 decimals — paise preserved
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const dispDate=iso=>{if(!iso)return"\u2014";const[y,m,dd]=iso.split("-");const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return dd+" "+(M[(+m)-1]||"")+" "+y;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const shiftISO=(iso,days)=>{const p=(iso||todayISO()).split("-").map(Number);const dt=new Date(p[0],p[1]-1,p[2]);dt.setDate(dt.getDate()+days);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const onlyInt=v=>String(v).replace(/[^0-9]/g,"");
const onlyDec=v=>{v=String(v).replace(/[^0-9.]/g,"");const i=v.indexOf(".");return i<0?v:v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"");};
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const round2=n=>Math.round((Number(n)||0)*100)/100;
const numStr=n=>String(round2(n));
const MONTHS_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthLabel=key=>{if(!key||key==="unknown")return "Undated";const a=key.split("-");return (MONTHS_FULL[(+a[1])-1]||"")+" "+a[0];};
const monthISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const shiftMonth=(key,d)=>{const a=(key||monthISO()).split("-").map(Number);const dt=new Date(a[0],a[1]-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");};

/* ===== theme palettes ===== */
function palette(t){
  if(t==="light")return{bg:"#F5F0E8",sf:"#FFFDF8",cd:"#F3EDE1",bd:"#E3DCCC",ac:"#B8902F",ad:"#9A7826",ag:"rgba(184,144,47,0.12)",tx:"#1A1A1A",tm:"#7A7468",td:"#A59C8C",dn:"#C0473F",su:"#3F9468"};
  return{bg:"#0D0D0D",sf:"#161616",cd:"#1F1F1F",bd:"#2A2A2A",ac:"#C5A23E",ad:"#A9863A",ag:"rgba(197,162,62,0.12)",tx:"#F2EDE3",tm:"#9A948A",td:"#5E5C56",dn:"#D96A6A",su:"#4CAE7A"};
}

/* ===== small presentational components (stable identities, theme via prop) ===== */
function Field({K,label,value,onChange,placeholder,type="text",style={}}){
  return(<div style={{display:"flex",flexDirection:"column",gap:5,...style}}>
    {label&&<label style={{fontSize:10,fontWeight:600,color:K.tm,letterSpacing:"0.1em",textTransform:"uppercase"}}>{label}</label>}
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"10px 13px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",width:"100%",boxSizing:"border-box",transition:"border-color .2s"}}
      onFocus={e=>e.target.style.borderColor=K.ac} onBlur={e=>e.target.style.borderColor=K.bd}/></div>);
}
function Btn({K,children,onClick,variant="primary",style={},disabled}){
  const V={primary:{bg:K.ac,color:"#111",bd:"none"},ghost:{bg:"transparent",color:K.tx,bd:"1px solid "+K.bd},danger:{bg:"transparent",color:K.dn,bd:"1px solid "+K.dn},solidDanger:{bg:K.dn,color:"#fff",bd:"none"}}[variant];
  return(<button disabled={disabled} onClick={onClick} style={{background:V.bg,color:V.color,border:V.bd,borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.45:1,transition:"transform .12s",...style}}
    onMouseDown={e=>!disabled&&(e.currentTarget.style.transform="scale(.97)")} onMouseUp={e=>e.currentTarget.style.transform="scale(1)"} onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>{children}</button>);
}
function Confirm({K,msg,onYes,onNo}){
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",backdropFilter:"blur(3px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}} onClick={onNo}>
    <div onClick={e=>e.stopPropagation()} style={{background:K.cd,border:"1px solid "+K.bd,borderRadius:16,padding:"24px",maxWidth:380,width:"100%",animation:"slideUp .25s ease"}}>
      <div className="serif" style={{fontSize:22,fontWeight:600,color:K.tx,marginBottom:6}}>Are you sure?</div>
      <div style={{fontSize:13,color:K.tm,lineHeight:1.5,marginBottom:20}}>{msg}</div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn K={K} variant="ghost" onClick={onNo}>Cancel</Btn>
        <Btn K={K} variant="solidDanger" onClick={onYes}>Delete</Btn></div></div></div>);
}
function Toast({K,msg}){return msg?<div style={{position:"fixed",top:18,left:"50%",transform:"translateX(-50%)",background:K.cd,border:"1px solid "+K.ac,borderRadius:30,padding:"11px 22px",color:K.ac,fontSize:13,fontWeight:600,zIndex:9999,boxShadow:"0 10px 40px rgba(0,0,0,.4)",animation:"fadeIn .3s ease"}}>{msg}</div>:null;}

function ItemDetail({K,detail,purchases,onClose}){
  if(!detail)return null;
  const hist=[];
  purchases.forEach(p=>(p.items||[]).forEach(li=>{if(li.code===detail.code)hist.push({date:p.date,vendor:p.vendor,billNo:p.billNo,qty:Number(li.qty)||0,rate:parseFloat(li.rate)||0,desc:li.desc});}));
  hist.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",backdropFilter:"blur(4px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:9998}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:K.sf,borderTop:"1px solid "+K.bd,borderRadius:"22px 22px 0 0",width:"100%",maxWidth:620,maxHeight:"90vh",overflowY:"auto",padding:"22px 20px calc(28px + env(safe-area-inset-bottom))",animation:"slideUp .28s ease"}}>
      <div style={{fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",color:K.ac,marginBottom:4}}>{detail.cat}</div>
      <div className="serif" style={{fontSize:26,fontWeight:600,color:K.tx,lineHeight:1.1}}>{detail.name}</div>
      <div style={{fontSize:11,color:K.tm,marginTop:4}}>Code {detail.code}{detail.rack?" · Rack "+detail.rack:""}</div>
      <div style={{background:"linear-gradient(135deg,"+K.cd+","+K.sf+")",border:"1px solid "+K.ac,borderRadius:16,padding:18,textAlign:"center",margin:"16px 0"}}>
        <div className="serif" style={{fontSize:42,fontWeight:700,color:K.ac,lineHeight:1}}>{fmt(detail.avg)}</div>
        <div style={{fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase",color:K.tm,marginTop:6}}>Weighted Average Cost / pc</div></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:18}}>
        {[["Total Qty",detail.qty+" pc"],["Total Spend",fmt(detail.val)],["Last Rate",fmt(detail.lastRate)],["Purchases",detail.count],["Lowest",fmt(detail.min)],["Highest",fmt(detail.max)]].map((s,i)=>(
          <div key={i} style={{background:K.cd,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
            <div style={{fontSize:14,fontWeight:700,color:K.tx}}>{s[1]}</div>
            <div style={{fontSize:9,letterSpacing:".08em",textTransform:"uppercase",color:K.tm,marginTop:3}}>{s[0]}</div></div>))}</div>
      <div style={{fontSize:10,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:K.tm,marginBottom:8}}>Purchase history</div>
      {hist.map((h,i)=>(<div key={i} style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:10,padding:"10px 12px",marginBottom:7,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
        <div style={{minWidth:0}}><div style={{fontSize:11,color:K.tm}}>{dispDate(h.date)}{h.vendor?" · "+h.vendor:""}{h.billNo?" · #"+h.billNo:""}</div>
          <div style={{fontWeight:600,fontSize:14,color:K.tx}}>{h.qty} pc {"\u00D7"} <span style={{color:K.ac}}>{fmt(h.rate)}</span></div>
          {h.desc?<div style={{fontSize:11,color:K.tm,fontStyle:"italic",marginTop:2}}>{h.desc}</div>:null}</div>
        <div style={{fontSize:12,color:K.tm,whiteSpace:"nowrap"}}>{fmt(h.qty*h.rate)}</div></div>))}
      <Btn K={K} variant="ghost" onClick={onClose} style={{width:"100%",marginTop:10}}>Close</Btn></div></div>);
}

/* ===================== APP ===================== */
function App(){
  const[theme,setTheme]=useState("dark");

  const[zipBusy,setZipBusy]=useState(false);

  // working purchase
  const[pDate,setPDate]=useState(todayISO());
  const[pVendor,setPVendor]=useState("");
  const[pBillNo,setPBillNo]=useState("");
  const[pNote,setPNote]=useState("");
  const[lines,setLines]=useState([]); // {code,name,rack,cat,qty(number),rate(string),desc}

  // catalog browse
  const[selCat,setSelCat]=useState(Object.keys(DEFAULT_CATALOG)[0]);

  const[gSearch,setGSearch]=useState("");

  // managers / ui
  const[showMgr,setShowMgr]=useState(false);
  const[showBackup,setShowBackup]=useState(false);
  const[nName,setNName]=useState("");const[nPrice,setNPrice]=useState("");const[nCode,setNCode]=useState("");
  const[newCatName,setNewCatName]=useState("");
  const[editIdx,setEditIdx]=useState(-1);const[editData,setEditData]=useState({});
  const[confirm,setConfirm]=useState(null);
  const[toast,setToast]=useState("");
  const[detail,setDetail]=useState(null);
  const[repSearch,setRepSearch]=useState("");
  const[repSort,setRepSort]=useState({k:"name",d:1});

  // sell rate calculator
  const[salesRows,setSalesRows]=useState([]);
  const[salesSearch,setSalesSearch]=useState("");
  const[salesCatFilter,setSalesCatFilter]=useState("");
  const[salesSort,setSalesSort]=useState({k:"name",d:1});
  const[salesPickerOpen,setSalesPickerOpen]=useState(false);
  const[sGlobal,setSGlobal]=useState("");
  const[sCat,setSCat]=useState(Object.keys(DEFAULT_CATALOG)[0]);
  const[sFilter,setSFilter]=useState("");
  const[scName,setScName]=useState("");const[scCost,setScCost]=useState("");
  const[nCat,setNCat]=useState("Custom");   // category for custom item added in Entry
  const[scCat,setScCat]=useState("Custom"); // category for custom item added in Sales
  const[catOverride,setCatOverride]=useState({}); // code -> category (for items not in catalogue)

  // monthly profit
  const[pfMonth,setPfMonth]=useState(monthISO());
  const[profitData,setProfitData]=useState({}); // { "2026-07": { CODE:{qty,sell,cost} } }
  const[pfSearch,setPfSearch]=useState("");
  const[pfCat,setPfCat]=useState("");
  const[pfOnly,setPfOnly]=useState(false);

  // history month folding
  const[openMonths,setOpenMonths]=useState({});

  // load
  useEffect(()=>{
    try{const t=localStorage.getItem("amazza-pt-theme");if(t)setTheme(t);}catch(e){}
    try{const c=localStorage.getItem("amazza-pt-catalog-v1");if(c)setCatalog(JSON.parse(c));}catch(e){}
    try{const p=localStorage.getItem("amazza-pt-purchases-v1");if(p)setPurchases(JSON.parse(p));}catch(e){}
    try{const s=localStorage.getItem("amazza-pt-sales-v1");if(s)setSalesRows(JSON.parse(s));}catch(e){}
    try{const f=localStorage.getItem("amazza-pt-profit-v1");if(f)setProfitData(JSON.parse(f));}catch(e){}
    try{const o=localStorage.getItem("amazza-pt-catoverride-v1");if(o)setCatOverride(JSON.parse(o));}catch(e){}
  },[]);
  useEffect(()=>{document.body.style.background=K.bg;},[K.bg]);
  useEffect(()=>{const h=()=>{const a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.type==="number")a.blur();};window.addEventListener("wheel",h,{passive:true});return()=>window.removeEventListener("wheel",h);},[]);

  const flash=m=>{setToast(m);setTimeout(()=>setToast(""),2200);};
  const saveCatalog=nc=>{setCatalog(nc);try{localStorage.setItem("amazza-pt-catalog-v1",JSON.stringify(nc));}catch(e){}};
  const savePurchases=list=>{setPurchases(list);try{localStorage.setItem("amazza-pt-purchases-v1",JSON.stringify(list));}catch(e){}};
  const saveSales=list=>{setSalesRows(list);try{localStorage.setItem("amazza-pt-sales-v1",JSON.stringify(list));}catch(e){}};
  const saveProfit=d=>{setProfitData(d);try{localStorage.setItem("amazza-pt-profit-v1",JSON.stringify(d));}catch(e){}};
  const saveOverride=o=>{setCatOverride(o);try{localStorage.setItem("amazza-pt-catoverride-v1",JSON.stringify(o));}catch(e){}};
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";setTheme(t);try{localStorage.setItem("amazza-pt-theme",t);}catch(e){}};

  // ----- per-item stats (DERIVED — single source of truth) -----
  const catOf=useMemo(()=>{const m={};Object.entries(catalog).forEach(([c,arr])=>arr.forEach(p=>m[p.id]=c));return m;},[catalog]);
  const stats=useMemo(()=>{
    const map={};
    const sorted=[...purchases].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    sorted.forEach(p=>(p.items||[]).forEach(li=>{
      const code=li.code;const q=Number(li.qty)||0;const r=parseFloat(li.rate)||0;if(q<=0)return;
      if(!map[code])map[code]={code,name:li.name||code,rack:li.rack||"",cat:catOverride[code]||catOf[code]||li.cat||"Other",qty:0,val:0,count:0,lastRate:0,lastDate:"",min:Infinity,max:0};
      const m=map[code];m.qty+=q;m.val+=q*r;m.count++;m.lastRate=r;m.lastDate=p.date;m.min=Math.min(m.min,r);m.max=Math.max(m.max,r);
    }));
    Object.values(map).forEach(m=>{m.avg=m.qty>0?m.val/m.qty:0;if(m.min===Infinity)m.min=0;});
    return map;
  },[purchases,catOf,catOverride]);
  const lastRateOf=code=>stats[code]?String(stats[code].lastRate):"";

  // ----- working purchase ops -----
  const lineQty=useMemo(()=>{const m={};lines.forEach(l=>m[l.code]=(m[l.code]||0)+l.qty);return m;},[lines]);
  const addLine=p=>{
    const ex=lines.findIndex(l=>l.code===p.id);
    if(ex>=0){const u=[...lines];u[ex]={...u[ex],qty:u[ex].qty+1};setLines(u);}
    else setLines([...lines,{code:p.id,name:p.name,rack:p.rack||"",cat:catOf[p.id]||"Other",qty:1,rate:lastRateOf(p.id),desc:""}]);
  };
  const updateLine=(idx,f,v)=>{const u=[...lines];u[idx]={...u[idx],[f]:f==="qty"?(Math.max(0,Number(v)||0)):v};setLines(u);};
  const removeLine=idx=>{const u=lines.filter((_,i)=>i!==idx);setLines(u);};
  const addCustomLine=()=>{if(!nName||!nPrice)return;const code="CUSTOM-"+uid();const cat=nCat||"Custom";setLines([...lines,{code,name:nName,rack:nCode||"",cat,qty:1,rate:String(Number(nPrice)||0),desc:""}]);if(cat!=="Custom")saveOverride({...catOverride,[code]:cat});setNName("");setNPrice("");setNCode("");};

  const resetWorking=()=>{setLines([]);setPDate(todayISO());setPVendor("");setPBillNo("");setPNote("");setEditingId(null);setGSearch("");setSearch("");};
  const subtotal=useMemo(()=>lines.reduce((s,l)=>s+l.qty*(parseFloat(l.rate)||0),0),[lines]);
  const totalQty=useMemo(()=>lines.reduce((s,l)=>s+l.qty,0),[lines]);

  const savePurchase=()=>{
    if(lines.length===0)return flash("Add at least one item");
    for(const l of lines){
      if(!(l.qty>0))return flash(l.name+" — quantity must be more than 0");
      if(l.rate===""||l.rate==null||isNaN(parseFloat(l.rate))||parseFloat(l.rate)<0)return flash(l.name+" — enter a valid rate");
    }
    const rec={
      id:editingId||uid(),date:pDate||todayISO(),vendor:pVendor.trim(),billNo:pBillNo.trim(),note:pNote.trim(),
      items:lines.map(l=>({code:l.code,name:l.name,rack:l.rack,cat:l.cat,qty:Number(l.qty),rate:parseFloat(l.rate),desc:(l.desc||"").trim()})),
      total:subtotal
    };
    let list;
    if(editingId){const i=purchases.findIndex(p=>p.id===editingId);list=[...purchases];if(i>=0)list[i]=rec;else list=[rec,...purchases];}
    else list=[rec,...purchases];
    savePurchases(list);resetWorking();flash(editingId?"Purchase updated":"Purchase saved");setView("report");
  };
  const loadPurchase=p=>{
    setEditingId(p.id);setPDate(p.date);setPVendor(p.vendor||"");setPBillNo(p.billNo||"");setPNote(p.note||"");
    setLines((p.items||[]).map(li=>({code:li.code,name:li.name,rack:li.rack||"",cat:li.cat||catOf[li.code]||"Other",qty:Number(li.qty)||0,rate:String(li.rate),desc:li.desc||""})));
    setView("entry");flash("Loaded for editing");
  };
  const deletePurchase=p=>setConfirm({msg:'Delete this purchase'+(p.vendor?' from '+p.vendor:'')+' dated '+dispDate(p.date)+'? Averages will recompute.',action:()=>{savePurchases(purchases.filter(x=>x.id!==p.id));if(editingId===p.id)resetWorking();setConfirm(null);flash("Purchase deleted");}});

  // ----- PDF / print -----
  const printPurchase=d=>{
    const items=(d.items||[]).filter(i=>(Number(i.qty)||0)>0);
    if(items.length===0){flash("Add items first");return;}
    const total=items.reduce((s,i)=>s+(Number(i.qty)||0)*(parseFloat(i.rate)||0),0);
    const tQty=items.reduce((s,i)=>s+(Number(i.qty)||0),0);
    const rows=items.map((it,idx)=>{const amt=(Number(it.qty)||0)*(parseFloat(it.rate)||0);
      return `<tr><td class="c">${idx+1}</td><td><div class="nm">${esc(it.name)}</div>${it.desc?`<div class="ds">${esc(it.desc)}</div>`:""}</td><td class="mono">${esc(it.rack)||"\u2014"}</td><td class="r">${Number(it.qty)||0}</td><td class="r">${fmt(parseFloat(it.rate)||0)}</td><td class="r b">${fmt(amt)}</td></tr>`;}).join("");
    const doc=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Purchase ${esc(d.billNo)||dispDate(d.date)}</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Montserrat,sans-serif;color:#1a1a1a;padding:40px;max-width:820px;margin:0 auto;font-size:13px}.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #C5A23E;padding-bottom:18px;margin-bottom:22px}.brand{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:700;letter-spacing:.06em}.sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#555;margin-top:2px}.co{font-size:11px;color:#444;margin-top:8px;line-height:1.5}.doc{font-size:18px;font-weight:700;color:#C5A23E;text-align:right}.meta{font-size:12px;color:#333;margin-top:8px;text-align:right;line-height:1.7}.vend{background:#f7f3ea;border-radius:8px;padding:14px 16px;margin-bottom:20px}.lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#777;margin-bottom:5px}table{width:100%;border-collapse:collapse;margin-bottom:18px}th{background:#1a1a1a;color:#fff;padding:9px 10px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;text-align:left}th.r,td.r{text-align:right}th.c,td.c{text-align:center}td{padding:9px 10px;border-bottom:1px solid #e2ddd2;vertical-align:top}.nm{font-weight:600}.ds{font-size:11px;color:#666;font-style:italic;margin-top:3px}.mono{font-family:monospace;font-size:11px;color:#555}.b{font-weight:700}.tot{display:flex;justify-content:flex-end}.totbox{width:280px}.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#444}.grand{display:flex;justify-content:space-between;padding:11px 0 4px;border-top:2px solid #C5A23E;margin-top:6px;font-size:19px;font-weight:700}.note{margin-top:22px;background:#f7f3ea;border-radius:8px;padding:14px 16px}.foot{margin-top:28px;padding-top:14px;border-top:1px solid #ccc;font-size:11px;color:#666;display:flex;justify-content:space-between}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:18px}}</style></head><body><div class="head"><div><div class="brand">AMAZZA</div><div class="sub">Premium Bath &amp; Sanitaryware</div><div class="co">Sky Impex<br>Purchase Record</div></div><div><div class="doc">PURCHASE</div><div class="meta">${d.billNo?`<strong>Bill #:</strong> ${esc(d.billNo)}<br>`:""}<strong>Date:</strong> ${dispDate(d.date)}</div></div></div><div class="vend"><div class="lbl">Supplier / Vendor</div><div style="font-weight:600;font-size:15px">${esc(d.vendor)||"\u2014"}</div></div><table><thead><tr><th class="c">#</th><th>Item</th><th>Rack</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table><div class="tot"><div class="totbox"><div class="trow"><span>Total Quantity</span><span>${tQty} pc</span></div><div class="grand"><span>Total</span><span>${fmt(total)}</span></div></div></div>${d.note?`<div class="note"><div class="lbl">Note</div><div style="font-size:12px;color:#444;line-height:1.5;white-space:pre-wrap">${esc(d.note)}</div></div>`:""}<div class="foot"><span>Generated by Amazza Purchase Tracker</span><span>${dispDate(d.date)}</span></div></body></html>`;
    const w=window.open("","_blank");
    if(!w){flash("Allow pop-ups to generate the PDF");return;}
    w.document.write(doc);w.document.close();setTimeout(()=>{try{w.focus();w.print();}catch(e){}},450);
  };


  // ----- bulk PDF -> ZIP export -----
  const PDF_GOLD=[197,162,62], PDF_DARK=[26,26,26], PDF_CREAM=[247,243,234];
  const pdfNum=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
  const pdfSafe=s=>String(s==null?"":s).replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();

  const buildPurchasePdf=d=>{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:"pt",format:"a4"});
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=42;
    const items=(d.items||[]).filter(i=>(Number(i.qty)||0)>0);
    const total=items.reduce((s,i)=>s+(Number(i.qty)||0)*(parseFloat(i.rate)||0),0);
    const tQty=items.reduce((s,i)=>s+(Number(i.qty)||0),0);

    doc.setFont("times","bold").setFontSize(26).setTextColor(26,26,26);
    doc.text("AMAZZA",M,58,{charSpace:1.6});
    doc.setFont("helvetica","normal").setFontSize(7).setTextColor(85,85,85);
    doc.text("PREMIUM BATH & SANITARYWARE",M,70,{charSpace:1.3});
    doc.setFontSize(9).setTextColor(68,68,68);
    doc.text("Sky Impex",M,87);
    doc.text("Purchase Record",M,98);

    doc.setFont("helvetica","bold").setFontSize(15).setTextColor(PDF_GOLD[0],PDF_GOLD[1],PDF_GOLD[2]);
    doc.text("PURCHASE",W-M,58,{align:"right"});
    doc.setFont("helvetica","normal").setFontSize(9).setTextColor(51,51,51);
    let ry=76;
    if(d.billNo){doc.text("Bill #: "+d.billNo,W-M,ry,{align:"right"});ry+=13;}
    doc.text("Date: "+dispDate(d.date),W-M,ry,{align:"right"});

    doc.setDrawColor(PDF_GOLD[0],PDF_GOLD[1],PDF_GOLD[2]).setLineWidth(2.4);
    doc.line(M,112,W-M,112);

    doc.setFillColor(PDF_CREAM[0],PDF_CREAM[1],PDF_CREAM[2]);
    doc.roundedRect(M,126,W-M*2,48,6,6,"F");
    doc.setFont("helvetica","normal").setFontSize(7.5).setTextColor(119,119,119);
    doc.text("SUPPLIER / VENDOR",M+14,145,{charSpace:1});
    doc.setFont("helvetica","bold").setFontSize(12).setTextColor(26,26,26);
    doc.text(d.vendor||"\u2014",M+14,163);

    doc.autoTable({
      startY:190, margin:{left:M,right:M,bottom:60},
      head:[["#","Item","Rack","Qty","Rate","Amount"]],
      body:items.map((it,i)=>[
        i+1,
        (it.name||"")+(it.desc?"\n"+it.desc:""),
        it.rack||"\u2014",
        Number(it.qty)||0,
        pdfNum(parseFloat(it.rate)||0),
        pdfNum((Number(it.qty)||0)*(parseFloat(it.rate)||0))
      ]),
      theme:"grid",
      styles:{fontSize:8.5,cellPadding:5,textColor:[26,26,26],lineColor:[226,221,210],lineWidth:0.5,overflow:"linebreak"},
      headStyles:{fillColor:PDF_DARK,textColor:255,fontSize:7.5,fontStyle:"bold",cellPadding:6},
      columnStyles:{
        0:{cellWidth:24,halign:"center"},
        2:{cellWidth:60,fontSize:8,textColor:[85,85,85]},
        3:{cellWidth:38,halign:"right"},
        4:{cellWidth:64,halign:"right"},
        5:{cellWidth:76,halign:"right",fontStyle:"bold"}
      }
    });

    let y=doc.lastAutoTable.finalY+18;
    if(y>H-150){doc.addPage();y=70;}
    const bx=W-M-210;
    doc.setFont("helvetica","normal").setFontSize(9.5).setTextColor(68,68,68);
    doc.text("Total Quantity",bx,y);
    doc.text(tQty+" pc",W-M,y,{align:"right"});
    y+=11;
    doc.setDrawColor(PDF_GOLD[0],PDF_GOLD[1],PDF_GOLD[2]).setLineWidth(1.6);
    doc.line(bx,y,W-M,y);
    y+=21;
    doc.setFont("helvetica","bold").setFontSize(15).setTextColor(26,26,26);
    doc.text("Total",bx,y);
    doc.text("Rs. "+pdfNum(total),W-M,y,{align:"right"});

    if(d.note){
      y+=24;
      const nl=doc.splitTextToSize(String(d.note),W-M*2-28);
      const bh=30+nl.length*11;
      if(y+bh>H-70){doc.addPage();y=70;}
      doc.setFillColor(PDF_CREAM[0],PDF_CREAM[1],PDF_CREAM[2]);
      doc.roundedRect(M,y,W-M*2,bh,6,6,"F");
      doc.setFont("helvetica","normal").setFontSize(7.5).setTextColor(119,119,119);
      doc.text("NOTE",M+14,y+17,{charSpace:1});
      doc.setFontSize(9).setTextColor(68,68,68);
      doc.text(nl,M+14,y+32);
    }

    const pages=doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setDrawColor(204,204,204).setLineWidth(0.5);
      doc.line(M,H-48,W-M,H-48);
      doc.setFont("helvetica","normal").setFontSize(8).setTextColor(102,102,102);
      doc.text("Generated by Amazza Purchase Tracker",M,H-34);
      doc.text(dispDate(d.date)+"   \u00B7   Page "+i+" of "+pages,W-M,H-34,{align:"right"});
    }
    return doc.output("blob");
  };

  const exportAllPdfZip=async()=>{
    if(!purchases.length)return flash("No purchases yet");
    if(!window.jspdf||!window.JSZip)return flash("PDF library not loaded \u2014 go online once, then reload");
    setZipBusy(true);setZipMsg("Starting\u2026");

    <div style={{position:"sticky",top:0,zIndex:50,background:K.sf,borderBottom:"1px solid "+K.bd,padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span className="serif" style={{fontSize:24,fontWeight:700,letterSpacing:"0.04em",color:K.ac}}>AMAZZA</span>
        <span style={{width:1,height:20,background:K.bd}}/>
        <div><div style={{fontSize:13,fontWeight:600,color:K.tm}}>Purchase Tracker</div>
        <div style={{fontSize:10,color:K.td}}>{totalP} catalogue items · {purchases.length} purchases</div></div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {navBtn("entry","Entry")}{navBtn("report","Report")}{navBtn("sales","Sales")}{navBtn("profit","Profit")}{navBtn("history","History")}
        <button onClick={toggleTheme} title="Theme" style={{width:38,height:38,borderRadius:10,border:"1px solid "+K.bd,background:K.cd,color:K.tx,cursor:"pointer",fontSize:16}}>{theme==="dark"?"\u263E":"\u2600"}</button>
        <button onClick={()=>setShowBackup(true)} title="Backup" style={{width:38,height:38,borderRadius:10,border:"1px solid "+K.bd,background:K.cd,color:K.tx,cursor:"pointer",fontSize:18}}>{"\u22EF"}</button>
      </div>
    </div>

    <div style={{maxWidth:1200,margin:"0 auto",padding:"18px 16px"}}>

    {/* ================= ENTRY ================= */}
    {view==="entry"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>{editingId?"Edit Purchase":"New Purchase"}</h2>
        {editingId&&<Btn K={K} variant="ghost" onClick={resetWorking}>{"\u002B"} Start fresh</Btn>}
      </div>
      <div className="row-fields" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:18}}>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:10,fontWeight:600,color:K.tm,letterSpacing:"0.1em",textTransform:"uppercase"}}>Date</label>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setPDate(shiftISO(pDate,-1))} title="Previous day" style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,cursor:"pointer",padding:"0 11px",fontSize:13,fontFamily:"inherit"}}>{"\u25C0"}</button>
            <input type="date" value={pDate} onChange={e=>setPDate(e.target.value)} onClick={e=>{try{e.target.showPicker&&e.target.showPicker();}catch(_){}}}
              style={{flex:1,minWidth:0,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"10px 12px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",colorScheme:theme,cursor:"pointer"}}
              onFocus={e=>e.target.style.borderColor=K.ac} onBlur={e=>e.target.style.borderColor=K.bd}/>
            <button onClick={()=>setPDate(shiftISO(pDate,1))} title="Next day" style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,cursor:"pointer",padding:"0 11px",fontSize:13,fontFamily:"inherit"}}>{"\u25B6"}</button>
          </div>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <button onClick={()=>setPDate(todayISO())} style={{background:"none",border:"none",color:K.ac,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",padding:0}}>Today</button>
            <button onClick={()=>setPDate(shiftISO(todayISO(),-1))} style={{background:"none",border:"none",color:K.tm,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",padding:0}}>Yesterday</button>
            <span style={{fontSize:11,color:K.td,marginLeft:"auto"}}>{dispDate(pDate)}</span>
          </div>
        </div>
        <Field K={K} label="Vendor / Supplier" value={pVendor} onChange={setPVendor} placeholder="e.g. Morbi Traders"/>
        <Field K={K} label="Bill / Invoice No" value={pBillNo} onChange={setPBillNo} placeholder="optional"/>
      </div>

      <div className="main-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"start"}}>
        {/* LEFT — catalogue browser */}
        <div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,padding:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:K.tm}}>Catalogue</span>
            <Btn K={K} variant="ghost" onClick={()=>setShowMgr(true)} style={{padding:"6px 12px",fontSize:12}}>Manage</Btn>
          </div>
          <input value={gSearch} onChange={e=>setGSearch(e.target.value)} placeholder={"\uD83D\uDD0D  Search all "+totalP+" items..."} style={{width:"100%",boxSizing:"border-box",background:K.ag,border:"1.5px solid "+K.ac+"55",borderRadius:10,padding:"11px 14px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:10}}/>
          {!gSearch.trim()&&(<div style={{display:"flex",gap:8,marginBottom:10}}>
            <select value={selCat} onChange={e=>setSelCat(e.target.value)} style={{flex:1,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}>
              {Object.keys(catalog).map(c=><option key={c} value={c}>{c} ({catalog[c].length})</option>)}</select>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="filter..." style={{width:120,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}/>
          </div>)}
          <div className="prod-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,maxHeight:"56vh",overflowY:"auto",paddingRight:2}}>
            {filtered.map(p=>{const inCart=lineQty[p.id]||0;const last=stats[p.id];return(
              <button key={p.id} onClick={()=>addLine(p)} style={{textAlign:"left",background:inCart?K.ag:K.bg,border:"1px solid "+(inCart?K.ac:K.bd),borderRadius:10,padding:"9px 10px",cursor:"pointer",position:"relative",fontFamily:"inherit",color:K.tx,transition:"border-color .15s"}}>
                {inCart>0&&<span style={{position:"absolute",top:6,right:6,background:K.ac,color:"#111",fontSize:10,fontWeight:800,borderRadius:20,minWidth:18,height:18,display:"grid",placeItems:"center",padding:"0 5px"}}>{inCart}</span>}
                <div style={{fontSize:12,fontWeight:600,lineHeight:1.25,paddingRight:18}}>{p.name}</div>
                <div style={{fontSize:9.5,color:K.td,marginTop:4}}>{p.id}{p.rack?" · "+p.rack:""}{gSearch.trim()?" · "+p._cat:""}</div>
                <div style={{fontSize:10,color:K.tm,marginTop:3}}>{last?"last "+fmt(last.lastRate):<span style={{color:K.td}}>sell {fmt(p.price)}</span>}</div>
              </button>);})}
            {filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:K.tm,padding:24,fontSize:13}}>No items found.</div>}
          </div>
        </div>

        {/* RIGHT — current purchase */}
        <div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,padding:14,position:"sticky",top:78}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:K.tm,marginBottom:10}}>This Purchase {lines.length>0&&"· "+lines.length+" items"}</div>
          <div style={{maxHeight:"44vh",overflowY:"auto",marginBottom:10}}>
            {lines.length===0?(<div style={{textAlign:"center",color:K.tm,padding:"34px 10px",fontSize:13}}><div style={{fontSize:34,opacity:.4,marginBottom:6}}>{"\uD83D\uDED2"}</div>Tap items on the left to add them here.</div>):
            lines.map((l,idx)=>{const last=stats[l.code];return(
              <div key={idx} style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:10,padding:10,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:8}}>
                  <div style={{minWidth:0}}><div style={{fontSize:13,fontWeight:600}}>{l.name}</div>
                    <div style={{fontSize:10,color:K.td,marginTop:1}}>{l.code}{l.rack?" · "+l.rack:""}{last?" · last "+fmt(last.lastRate):""}</div></div>
                  <button onClick={()=>removeLine(idx)} style={{background:"none",border:"none",color:K.dn,fontSize:16,cursor:"pointer",lineHeight:1}}>{"\u2715"}</button></div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{display:"flex",alignItems:"center",background:K.sf,borderRadius:8,border:"1px solid "+K.bd}}>
                    <button onClick={()=>updateLine(idx,"qty",l.qty-1)} style={{background:"none",border:"none",color:K.tm,cursor:"pointer",padding:"5px 10px",fontSize:15,fontFamily:"inherit"}}>{"\u2212"}</button>
                    <input type="text" inputMode="numeric" value={l.qty} onChange={e=>updateLine(idx,"qty",onlyInt(e.target.value))} onFocus={e=>e.target.select()} style={{width:38,textAlign:"center",background:"transparent",border:"none",color:K.tx,fontSize:13,fontWeight:600,fontFamily:"inherit",outline:"none"}}/>
                    <button onClick={()=>updateLine(idx,"qty",l.qty+1)} style={{background:"none",border:"none",color:K.tm,cursor:"pointer",padding:"5px 10px",fontSize:15,fontFamily:"inherit"}}>{"\u002B"}</button></div>
                  <span style={{color:K.td,fontSize:12}}>{"\u00D7"}</span>
                  <div style={{display:"flex",alignItems:"center",gap:4,background:K.sf,border:"1px solid "+K.bd,borderRadius:8,padding:"0 8px"}}>
                    <span style={{color:K.tm,fontSize:12}}>{"\u20B9"}</span>
                    <input type="text" inputMode="decimal" value={l.rate} onChange={e=>updateLine(idx,"rate",onlyDec(e.target.value))} onFocus={e=>e.target.select()} placeholder="rate" style={{width:64,background:"transparent",border:"none",color:K.tx,fontSize:13,fontFamily:"inherit",textAlign:"right",outline:"none",padding:"7px 0"}}/></div>
                  <span style={{marginLeft:"auto",fontWeight:700,fontSize:14,color:K.ac}}>{fmt(l.qty*(parseFloat(l.rate)||0))}</span></div>
                <input value={l.desc} onChange={e=>updateLine(idx,"desc",e.target.value)} placeholder="+ description (optional)" style={{width:"100%",boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:7,padding:"6px 9px",color:K.tm,fontSize:11,fontFamily:"inherit",outline:"none",fontStyle:"italic",marginTop:8}}/>
              </div>);})}
          </div>

          {/* custom item */}
          <details style={{marginBottom:10}}>
            <summary style={{fontSize:11,color:K.tm,cursor:"pointer",userSelect:"none"}}>+ Add an item not in the catalogue</summary>
            <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
              <input value={nName} onChange={e=>setNName(e.target.value)} placeholder="Item name" style={{flex:2,minWidth:130,background:K.bg,border:"1px solid "+K.bd,borderRadius:7,padding:"8px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
              <input value={nPrice} onChange={e=>setNPrice(e.target.value)} type="number" placeholder="Rate" style={{width:70,background:K.bg,border:"1px solid "+K.bd,borderRadius:7,padding:"8px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
              <select value={nCat} onChange={e=>setNCat(e.target.value)} title="Category for this item" style={{maxWidth:150,background:K.bg,border:"1px solid "+K.bd,borderRadius:7,padding:"8px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}>
                <option value="Custom">Custom</option>{Object.keys(catalog).map(c=><option key={c} value={c}>{c}</option>)}</select>
              <Btn K={K} onClick={addCustomLine} style={{padding:"8px 12px"}}>Add</Btn></div>
          </details>

          <input value={pNote} onChange={e=>setPNote(e.target.value)} placeholder="Note for this purchase (optional)" style={{width:"100%",boxSizing:"border-box",background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"9px 12px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none",marginBottom:10}}/>

          <div style={{background:K.cd,borderRadius:12,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:K.tm,padding:"2px 0"}}><span>Total quantity</span><span style={{color:K.tx}}>{totalQty} pc</span></div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0 2px",borderTop:"1px solid "+K.bd,marginTop:6}}>
              <span className="serif" style={{fontSize:18,fontWeight:600}}>Purchase Total</span>
              <span className="serif" style={{fontSize:24,fontWeight:700,color:K.ac}}>{fmt(subtotal)}</span></div>
          </div>
          <Btn K={K} onClick={savePurchase} disabled={lines.length===0} style={{width:"100%",marginTop:10,padding:"13px",fontSize:14}}>{editingId?"Update Purchase":"Save Purchase"}</Btn>
          <Btn K={K} variant="ghost" onClick={()=>printPurchase({date:pDate,vendor:pVendor,billNo:pBillNo,note:pNote,items:lines})} disabled={lines.length===0} style={{width:"100%",marginTop:8,padding:"12px",fontSize:13}}>{"\u2B07"} Generate PDF / Print</Btn>
        </div>
      </div>
    </div>)}

    {/* ================= REPORT ================= */}
    {view==="report"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>Average Cost Report</h2>
        <Btn K={K} variant="ghost" onClick={exportReport} style={{padding:"9px 16px",fontSize:13}}>{"\u2B07"} Export Excel</Btn>
      </div>
      <p style={{fontSize:12,color:K.tm,marginBottom:14}}>Weighted average purchase cost per item, across every recorded purchase.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
        {[["Items Purchased",Object.keys(stats).length],["Total Purchases",purchases.length],["Total Spend",fmt(grandSpend)]].map((s,i)=>(
          <div key={i} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:14,padding:"14px 16px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:K.ac,opacity:.7}}/>
            <div className="serif" style={{fontSize:26,fontWeight:700,color:K.ac,lineHeight:1}}>{s[1]}</div>
            <div style={{fontSize:9.5,letterSpacing:".12em",textTransform:"uppercase",color:K.tm,marginTop:5}}>{s[0]}</div></div>))}</div>
      <input value={repSearch} onChange={e=>setRepSearch(e.target.value)} placeholder={"\uD83D\uDD0D  Search report..."} style={{width:"100%",boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:12,padding:"12px 15px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:14}}/>
      <div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:14,overflow:"hidden",overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:560}}>
          <thead><tr>{[["name","Item"],["qty","Qty"],["avg","Avg Cost"],["lastRate","Last"],["val","Spend"],["count","Buys"]].map(h=>(
            <th key={h[0]} onClick={()=>setRepSort(s=>s.k===h[0]?{k:h[0],d:-s.d}:{k:h[0],d:1})} style={{background:K.cd,padding:"11px 12px",textAlign:h[0]==="name"?"left":"right",fontSize:10,letterSpacing:".08em",textTransform:"uppercase",color:K.tm,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{h[1]} {repSort.k===h[0]?(repSort.d===1?"\u25B2":"\u25BC"):""}</th>))}</tr></thead>
          <tbody>
            {repRows.map(r=>(<tr key={r.code} onClick={()=>setDetail(r)} style={{borderTop:"1px solid "+K.bd,cursor:"pointer"}}>
              <td style={{padding:"11px 12px"}}><div style={{fontWeight:600}}>{r.name}</div><div style={{fontSize:10,color:K.td,marginTop:2}}>{r.cat}{r.rack?" · "+r.rack:""}</div></td>
              <td style={{padding:"11px 12px",textAlign:"right"}}>{r.qty}</td>
              <td style={{padding:"11px 12px",textAlign:"right",fontWeight:700,color:K.ac}}>{fmt(r.avg)}</td>
              <td style={{padding:"11px 12px",textAlign:"right",color:K.tm}}>{fmt(r.lastRate)}</td>
              <td style={{padding:"11px 12px",textAlign:"right"}}>{fmt(r.val)}</td>
              <td style={{padding:"11px 12px",textAlign:"right",color:K.tm}}>{r.count}</td></tr>))}
            {repRows.length===0&&<tr><td colSpan={6} style={{padding:34,textAlign:"center",color:K.tm}}>No purchases recorded yet. Add one from the Entry tab.</td></tr>}
          </tbody></table></div>
      <p style={{fontSize:11,color:K.td,marginTop:10}}>Tap any row to see that item's full purchase history.</p>
    </div>)}

    {/* ================= SELL RATE CALCULATOR ================= */}
    {view==="sales"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>Sell Rate Calculator</h2>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn K={K} variant="ghost" onClick={()=>setShowMgr(true)} style={{padding:"9px 14px",fontSize:13}}>Manage items</Btn>
          <Btn K={K} variant="ghost" onClick={exportSales} style={{padding:"9px 14px",fontSize:13}}>{"\u2B07"} Export Excel</Btn>
        </div>
      </div>
      <p style={{fontSize:12,color:K.tm,marginBottom:14}}>Add items, set the cost and any extra expense, then type a markup % <em>or</em> a selling price — each fills the other automatically. Cost is pre-filled from your weighted average purchase cost when available.</p>

      {/* toolbar */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <input value={salesSearch} onChange={e=>setSalesSearch(e.target.value)} placeholder={"\uD83D\uDD0D  Search items..."} style={{flex:"1 1 200px",minWidth:160,boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:12,padding:"11px 14px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
        {salesCats.length>0&&<div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.tm}}>Category</span>
          <select value={salesCatFilter} onChange={e=>setSalesCatFilter(e.target.value)} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none",maxWidth:170}}>
            <option value="">All categories</option>{salesCats.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>}
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.tm}}>Sort</span>
          <select value={salesSort.k} onChange={e=>setSalesSort(s=>({k:e.target.value,d:s.d}))} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}>
            <option value="name">Name</option><option value="pct">Markup %</option><option value="sell">Selling price</option><option value="net">Net rate</option><option value="cost">Cost</option><option value="profit">Profit / pc</option>
          </select>
          <button onClick={()=>setSalesSort(s=>({k:s.k,d:-s.d}))} title="Toggle ascending / descending" style={{background:K.cd,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,cursor:"pointer",padding:"9px 12px",fontSize:13,fontFamily:"inherit"}}>{salesSort.d===1?"\u25B2":"\u25BC"}</button>
        </div>
        <Btn K={K} onClick={()=>setSalesPickerOpen(o=>!o)} style={{padding:"9px 14px",fontSize:13}}>{salesPickerOpen?"\u2715 Close":"\u002B Add items"}</Btn>
        {salesRows.length>0&&<Btn K={K} variant="danger" onClick={clearSales} style={{padding:"9px 14px",fontSize:13}}>Clear</Btn>}
      </div>

      {/* item picker */}
      {salesPickerOpen&&(<div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,padding:14,marginBottom:14}}>
        <input value={sGlobal} onChange={e=>setSGlobal(e.target.value)} placeholder={"\uD83D\uDD0D  Search all "+totalP+" items..."} style={{width:"100%",boxSizing:"border-box",background:K.ag,border:"1.5px solid "+K.ac+"55",borderRadius:10,padding:"11px 14px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:10}}/>
        {!sGlobal.trim()&&(<div style={{display:"flex",gap:8,marginBottom:10}}>
          <select value={sCat} onChange={e=>setSCat(e.target.value)} style={{flex:1,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}>
            {Object.keys(catalog).map(c=><option key={c} value={c}>{c} ({catalog[c].length})</option>)}</select>
          <input value={sFilter} onChange={e=>setSFilter(e.target.value)} placeholder="filter..." style={{width:120,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}/>
        </div>)}
        {salesPickRows.length>0&&(()=>{const newCount=salesPickRows.filter(p=>!inSales[p.id]).length;return(
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,background:K.ag,border:"1px solid "+K.ac+"55",borderRadius:10,padding:"8px 12px",marginBottom:10}}>
            <span style={{fontSize:12,color:K.tm}}>{sGlobal.trim()?salesPickRows.length+" match"+(salesPickRows.length>1?"es":""):salesPickRows.length+" in "+sCat}{newCount<salesPickRows.length?" · "+newCount+" not yet added":""}</span>
            <Btn K={K} onClick={addSalesAll} style={{padding:"7px 14px",fontSize:12.5,whiteSpace:"nowrap",opacity:newCount>0?1:0.5}}>{"\u002B"} Add {sGlobal.trim()?"all matching":"whole category"}{newCount>0?" ("+newCount+")":""}</Btn>
          </div>);})()}
        <div className="prod-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,maxHeight:"40vh",overflowY:"auto",paddingRight:2}}>
          {salesPickRows.map(p=>{const added=inSales[p.id];const avg=stats[p.id]?stats[p.id].avg:0;return(
            <button key={p.id} onClick={()=>addSalesItem(p)} style={{textAlign:"left",background:added?K.ag:K.bg,border:"1px solid "+(added?K.ac:K.bd),borderRadius:10,padding:"9px 10px",cursor:"pointer",position:"relative",fontFamily:"inherit",color:K.tx}}>
              {added&&<span style={{position:"absolute",top:6,right:7,color:K.ac,fontSize:12,fontWeight:800}}>{"\u2713"}</span>}
              <div style={{fontSize:12,fontWeight:600,lineHeight:1.25,paddingRight:16}}>{p.name}</div>
              <div style={{fontSize:9.5,color:K.td,marginTop:4}}>{p.id}{p.rack?" · "+p.rack:""}{sGlobal.trim()?" · "+p._cat:""}</div>
              <div style={{fontSize:10,color:K.tm,marginTop:3}}>{avg>0?"avg cost "+fmt(avg):<span style={{color:K.td}}>sell {fmt(p.price)}</span>}</div>
            </button>);})}

    {/* ================= MONTHLY PROFIT ================= */}

                <Btn K={K} variant="ghost" onClick={()=>loadPurchase(p)} style={{padding:"7px 14px",fontSize:12}}>Edit</Btn>
                <Btn K={K} variant="danger" onClick={()=>deletePurchase(p)} style={{padding:"7px 14px",fontSize:12}}>Delete</Btn></div>
            </div>))}
          </div>}
        </div>);})}
    </div>)}

        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="New category name" style={{flex:1,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"9px 11px",color:K.tx,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
          <Btn K={K} onClick={addCategory}>+ Category</Btn></div>
        <select value={selCat} onChange={e=>{setSelCat(e.target.value);setEditIdx(-1);}} style={{width:"100%",background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"10px",outline:"none",marginBottom:6}}>
          {Object.keys(catalog).map(c=><option key={c} value={c}>{c} ({catalog[c].length})</option>)}</select>
        {catalog[selCat]&&catalog[selCat].length===0&&<Btn K={K} variant="danger" onClick={()=>removeCategory(selCat)} style={{marginBottom:10,fontSize:12,padding:"6px 12px"}}>Delete empty category</Btn>}

        <div style={{display:"flex",gap:6,margin:"10px 0"}}>
          <input value={nName} onChange={e=>setNName(e.target.value)} placeholder="Item name" style={{flex:2,background:K.bg,border:"1px solid "+K.bd,borderRadius:7,padding:"8px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
          <input value={nCode} onChange={e=>setNCode(e.target.value)} placeholder="Rack" style={{width:64,background:K.bg,border:"1px solid "+K.bd,borderRadius:7,padding:"8px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
          <input value={nPrice} onChange={e=>setNPrice(e.target.value)} type="number" placeholder="Sell ₹" style={{width:70,background:K.bg,border:"1px solid "+K.bd,borderRadius:7,padding:"8px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
          <Btn K={K} onClick={addToCat} style={{padding:"8px 12px"}}>Add</Btn></div>

        <div style={{maxHeight:"42vh",overflowY:"auto"}}>
          {(catalog[selCat]||[]).map((p,idx)=>(<div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 4px",borderTop:"1px solid "+K.bd}}>
            {editIdx===idx?(<React.Fragment>
              <input value={editData.name} onChange={e=>setEditData({...editData,name:e.target.value})} style={{flex:2,background:K.bg,border:"1px solid "+K.ac,borderRadius:6,padding:"6px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
              <input value={editData.rack||""} onChange={e=>setEditData({...editData,rack:e.target.value})} style={{width:56,background:K.bg,border:"1px solid "+K.ac,borderRadius:6,padding:"6px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
              <input value={editData.price} onChange={e=>setEditData({...editData,price:e.target.value})} type="number" style={{width:62,background:K.bg,border:"1px solid "+K.ac,borderRadius:6,padding:"6px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
              <button onClick={saveEdit} style={{background:K.su,border:"none",color:"#fff",borderRadius:6,padding:"6px 10px",fontSize:12,cursor:"pointer"}}>{"\u2713"}</button>
            </React.Fragment>):(<React.Fragment>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600}}>{p.name}</div><div style={{fontSize:10,color:K.td}}>{p.id}{p.rack?" · "+p.rack:""} · sell {fmt(p.price)}</div></div>
              <select onChange={e=>{if(e.target.value){moveItem(selCat,idx,e.target.value);e.target.value="";}}} value="" style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:6,color:K.tm,fontFamily:"inherit",fontSize:11,padding:"4px",outline:"none"}}>
                <option value="">move...</option>{Object.keys(catalog).filter(c=>c!==selCat).map(c=><option key={c} value={c}>{c}</option>)}</select>
              <button onClick={()=>startEdit(idx,p)} style={{background:"none",border:"none",color:K.tm,fontSize:14,cursor:"pointer"}}>{"\u270E"}</button>
              <button onClick={()=>rmFromCat(selCat,idx)} style={{background:"none",border:"none",color:K.dn,fontSize:14,cursor:"pointer"}}>{"\u2715"}</button>
            </React.Fragment>)}
          </div>))}
        </div>
        <Btn K={K} variant="ghost" onClick={()=>{setShowMgr(false);setEditIdx(-1);}} style={{width:"100%",marginTop:12}}>Done</Btn>
      </div></div>)}

    {/* ====== BACKUP ====== */}
    {showBackup&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9997,padding:16}} onClick={()=>setShowBackup(false)}>
      <div onClick={e=>e.stopPropagation()} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,width:"100%",maxWidth:380,padding:22,animation:"slideUp .25s ease"}}>
        <h3 className="serif" style={{fontSize:22,fontWeight:600,marginBottom:4}}>Data & Backup</h3>
        <p style={{fontSize:12,color:K.tm,marginBottom:16}}>Everything saves on this device. Export regularly so you never lose it.</p>
        <Btn K={K} onClick={exportData} style={{width:"100%",marginBottom:8}}>{"\u2B07"} Export backup (.json)</Btn>
        <Btn K={K} variant="ghost" onClick={()=>document.getElementById("imp").click()} style={{width:"100%",marginBottom:8}}>{"\u2B06"} Import backup</Btn>
        <input id="imp" type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
        <Btn K={K} variant="danger" onClick={wipeAll} style={{width:"100%",marginBottom:8}}>Erase all data</Btn>
        <Btn K={K} variant="ghost" onClick={()=>setShowBackup(false)} style={{width:"100%"}}>Close</Btn>
      </div></div>)}

  </div>);
}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
