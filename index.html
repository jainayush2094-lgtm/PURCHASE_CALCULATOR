/* ===== helpers ===== */
const fmt=n=>"\u20B9"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});  // up to 2 decimals — paise preserved
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const dispDate=iso=>{if(!iso)return"\u2014";const[y,m,dd]=iso.split("-");const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return dd+" "+(M[(+m)-1]||"")+" "+y;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const shiftISO=(iso,days)=>{const p=(iso||todayISO()).split("-").map(Number);const dt=new Date(p[0],p[1]-1,p[2]);dt.setDate(dt.getDate()+days);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const onlyInt=v=>String(v).replace(/[^0-9]/g,"");
const onlyDec=v=>{v=String(v).replace(/[^0-9.]/g,"");const i=v.indexOf(".");return i<0?v:v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"");};
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const round2=n=>Math.round((Number(n)||0)*100)/100;
const numStr=n=>String(round2(n));
const MONTHS_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthLabel=key=>{if(!key||key==="unknown")return "Undated";const a=key.split("-");return (MONTHS_FULL[(+a[1])-1]||"")+" "+a[0];};
const monthISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const shiftMonth=(key,d)=>{const a=(key||monthISO()).split("-").map(Number);const dt=new Date(a[0],a[1]-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");};
const words=s=>String(s||"").toLowerCase().trim().split(/\s+/).filter(Boolean);
const matches=(hay,ws)=>{hay=hay.toLowerCase();return ws.every(x=>hay.includes(x));};

/* ===== storage (same keys as earlier versions, so existing data loads untouched) ===== */
const KEYS={theme:"amazza-pt-theme",catalog:"amazza-pt-catalog-v1",purchases:"amazza-pt-purchases-v1",sales:"amazza-pt-sales-v1",profit:"amazza-pt-profit-v1",override:"amazza-pt-catoverride-v1"};
const SNAPSHOT_KEY="amazza-pt-snapshot-before-v3";
const MIGRATED_KEY="amazza-pt-v3-migrated";
const readJSON=(k,fb)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):fb;}catch(e){return fb;}};
const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* Old versions created "custom" items (codes CUSTOM-... from Entry, SX-... from Sales) that lived only
   inside a purchase or a sell-rate row, never in the catalogue, so they could not be picked again.
   This copies them INTO the catalogue under the same code. Nothing is removed or renamed. */
function migrateCustomItems(catalog,purchases,sales,override){
  const nc={};Object.keys(catalog||{}).forEach(c=>nc[c]=[...catalog[c]]);
  const known=new Set();Object.values(nc).forEach(a=>a.forEach(p=>known.add(p.id)));
  let added=0;
  const add=(code,name,rack,cat,price)=>{
    if(!code||known.has(code)||!/^(CUSTOM-|SX-)/.test(code))return;
    known.add(code);cat=(cat&&String(cat).trim())||"Custom";
    if(!nc[cat])nc[cat]=[];
    nc[cat].push({id:code,name:name||code,price:Number(price)||0,rack:rack||""});added++;
  };
  (purchases||[]).forEach(p=>(p.items||[]).forEach(li=>add(li.code,li.name,li.rack,(override||{})[li.code]||li.cat)));
  (sales||[]).forEach(r=>add(r.code,r.name,r.rack,(override||{})[r.code]||r.cat,r.sell));
  return{catalog:nc,added};
}

function loadAll(){
  // one-time safety copy of the raw saved data, taken before this version writes anything
  try{
    if(!localStorage.getItem(SNAPSHOT_KEY)){
      const snap={takenAt:new Date().toISOString()};let any=false;
      Object.entries(KEYS).forEach(([n,k])=>{const v=localStorage.getItem(k);if(v!=null){snap[n]=v;any=true;}});
      if(any)localStorage.setItem(SNAPSHOT_KEY,JSON.stringify(snap));
    }
  }catch(e){}
  let theme="dark";try{theme=localStorage.getItem(KEYS.theme)||"dark";}catch(e){}
  let catalog=readJSON(KEYS.catalog,null)||DEFAULT_CATALOG;
  const purchases=readJSON(KEYS.purchases,[])||[];
  const sales=readJSON(KEYS.sales,[])||[];
  const profit=readJSON(KEYS.profit,{})||{};
  const override=readJSON(KEYS.override,{})||{};
  let migrated=0;
  try{
    if(!localStorage.getItem(MIGRATED_KEY)){
      const m=migrateCustomItems(catalog,purchases,sales,override);
      if(m.added>0){catalog=m.catalog;writeJSON(KEYS.catalog,catalog);}
      migrated=m.added;localStorage.setItem(MIGRATED_KEY,new Date().toISOString());
    }
  }catch(e){}
  return{theme,catalog,purchases,sales,profit,override,migrated};
}

/* ===== auto item code: continues the category's own series (NV-018 -> NV-019) ===== */
function nextCode(catalog,cat){
  const all=new Set();const prefixCat={};
  Object.entries(catalog).forEach(([c,arr])=>arr.forEach(p=>{all.add(p.id);const m=/^([A-Z]{1,5})-(\d+)$/.exec(p.id);if(m&&!prefixCat[m[1]])prefixCat[m[1]]=c;}));
  const cnt={};let width=3;
  (catalog[cat]||[]).forEach(p=>{const m=/^([A-Z]{1,5})-(\d+)$/.exec(p.id);if(m){cnt[m[1]]=(cnt[m[1]]||0)+1;width=Math.max(width,m[2].length);}});
  let prefix=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(!prefix){
    const w=String(cat).toUpperCase().replace(/[^A-Z ]/g," ").split(/\s+/).filter(x=>x&&x!=="AND"&&x!=="SERIES");
    const cands=[];
    if(w.length>=2)cands.push(w[0][0]+w[1][0]);
    if(w[0])cands.push(w[0].slice(0,2),w[0].slice(0,3));
    if(w.length>=3)cands.push(w[0][0]+w[1][0]+w[2][0]);
    cands.push("IT");
    prefix=cands.find(c=>c.length>=2&&!prefixCat[c]);
    if(!prefix){let i=1;while(prefixCat["X"+i])i++;prefix="X"+i;}
  }
  let n=0;all.forEach(id=>{const m=/^([A-Z]{1,5})-(\d+)$/.exec(id);if(m&&m[1]===prefix)n=Math.max(n,+m[2]);});
  let id;do{n++;id=prefix+"-"+String(n).padStart(width,"0");}while(all.has(id));
  return id;
}

/* ===== ONE simple "New item" form, used from Entry, Sell Rates and the Items manager ===== */
function NewItemSheet({K,catalog,mode,initial,onCreate,onPickExisting,onClose}){
  const cats=Object.keys(catalog);
  const startCat=initial&&initial.cat&&catalog[initial.cat]?initial.cat:(cats[0]||"");
  const[name,setName]=useState(String((initial&&initial.name)||"").toUpperCase());
  const[cat,setCat]=useState(startCat);
  const[makingCat,setMakingCat]=useState(cats.length===0);
  const[newCat,setNewCat]=useState("");
  const[rate,setRate]=useState("");const[sell,setSell]=useState("");const[rack,setRack]=useState("");const[qty,setQty]=useState("1");
  const[err,setErr]=useState("");const[dupOk,setDupOk]=useState(false);const[done,setDone]=useState([]);
  const nameRef=React.useRef(null);
  useEffect(()=>{setTimeout(()=>{try{nameRef.current&&nameRef.current.focus();}catch(e){}},80);},[]);
  const finalCat=makingCat?newCat.trim().toUpperCase():cat;
  const code=finalCat?nextCode(catalog,finalCat):"";
  const similar=useMemo(()=>{
    const n=name.trim();if(n.length<3)return[];const ws=words(n);const out=[];
    Object.entries(catalog).forEach(([c,arr])=>arr.forEach(p=>{if(matches(p.name,ws))out.push({...p,_cat:c});}));
    out.sort((a,b)=>(a.name.toUpperCase()===n.toUpperCase()?-1:0)-(b.name.toUpperCase()===n.toUpperCase()?-1:0));
    return out.slice(0,5);
  },[name,catalog]);
  const exact=similar.find(s=>s.name.toUpperCase()===name.trim().toUpperCase());
  const markup=num(rate)>0&&num(sell)>0?round2((num(sell)/num(rate)-1)*100):null;
  const submit=keepOpen=>{
    const n=name.trim().toUpperCase();
    if(!n){setErr("Type the item name");return;}
    if(!finalCat){setErr(makingCat?"Type the new category name":"Choose a category");return;}
    if(exact&&!dupOk){setErr("\""+exact.name+"\" already exists in "+exact._cat+". Tap it above to use it, or press Add again to create it anyway.");setDupOk(true);return;}
    if(mode==="entry"&&!(Number(qty)>0)){setErr("Quantity must be more than 0");return;}
    onCreate({name:n,cat:finalCat,rack:rack.trim().toUpperCase(),rate,sell,qty:Number(qty)||1});
    if(keepOpen){
      setDone(d=>[n,...d].slice(0,4));
      setName("");setRate("");setSell("");setRack("");setQty("1");setErr("");setDupOk(false);
      if(makingCat){setCat(finalCat);setMakingCat(false);setNewCat("");}
      setTimeout(()=>{try{nameRef.current&&nameRef.current.focus();}catch(e){}},30);
    }else onClose();
  };
  const onKey=e=>{if(e.key==="Enter"){e.preventDefault();submit(false);}};
  const lab={fontSize:10,fontWeight:700,color:K.tm,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:5,display:"block"};
  const box={width:"100%",boxSizing:"border-box",background:K.bg,border:"1px solid "+K.bd,borderRadius:10,padding:"12px 13px",color:K.tx,fontSize:15,fontFamily:"inherit",outline:"none"};
  const money=(val,set,ph,accent)=>(<div style={{display:"flex",alignItems:"center",gap:4,background:K.bg,border:"1px solid "+(accent?K.ac+"77":K.bd),borderRadius:10,padding:"0 10px",minWidth:0}}>
    <span style={{color:K.tm,fontSize:14}}>{"₹"}</span>
    <input inputMode="decimal" value={val} onChange={e=>set(onlyDec(e.target.value))} onKeyDown={onKey} placeholder={ph} style={{flex:1,minWidth:0,background:"transparent",border:"none",color:K.tx,fontSize:15,fontFamily:"inherit",outline:"none",padding:"12px 0"}}/></div>);
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.62)",backdropFilter:"blur(4px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:9998}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} className="sheet" style={{background:K.sf,borderTop:"1px solid "+K.ac,borderRadius:"22px 22px 0 0",width:"100%",maxWidth:560,maxHeight:"94vh",overflowY:"auto",padding:"20px 18px calc(22px + env(safe-area-inset-bottom))",animation:"slideUp .25s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <h3 className="serif" style={{fontSize:24,fontWeight:700}}>New Item</h3>
        <button onClick={onClose} style={{background:"none",border:"none",color:K.tm,fontSize:20,cursor:"pointer"}}>{"✕"}</button></div>
      <p style={{fontSize:12,color:K.tm,marginBottom:16,lineHeight:1.5}}>
        {mode==="entry"?"Saved to your catalogue, added to Sell Rates, and put on this purchase.":"Saved to your catalogue and added to Sell Rates automatically."}</p>

      <label style={lab}>Item name</label>
      <input ref={nameRef} value={name} onChange={e=>{setName(e.target.value.toUpperCase());setErr("");setDupOk(false);}} onKeyDown={onKey} placeholder="e.g. NOVA WALL MIXER" style={{...box,fontWeight:600}}/>
      {similar.length>0&&(<div style={{marginTop:8,background:K.cd,border:"1px solid "+K.bd,borderRadius:10,padding:"8px 10px"}}>
        <div style={{fontSize:10,color:K.tm,marginBottom:6,letterSpacing:".06em",textTransform:"uppercase",fontWeight:700}}>Already in catalogue? Tap to use it</div>
        {similar.map(s=>(<button key={s.id} onClick={()=>{onPickExisting(s);onClose();}} style={{display:"flex",width:"100%",justifyContent:"space-between",gap:8,background:"none",border:"none",borderTop:"1px solid "+K.bd,padding:"7px 2px",color:K.tx,fontFamily:"inherit",fontSize:12.5,cursor:"pointer",textAlign:"left"}}>
          <span style={{fontWeight:600}}>{s.name}</span><span style={{color:K.td,fontSize:11,whiteSpace:"nowrap"}}>{s._cat} · {s.id}</span></button>))}
      </div>)}

      <div style={{marginTop:14}}>
        <label style={lab}>Category</label>
        {!makingCat?(<select value={cat} onChange={e=>{if(e.target.value==="__new__"){setMakingCat(true);}else setCat(e.target.value);setErr("");}} style={{...box,cursor:"pointer"}}>
          {cats.map(c=><option key={c} value={c}>{c} ({catalog[c].length})</option>)}
          <option value="__new__">{"+"} New category...</option></select>):
        (<div style={{display:"flex",gap:8}}>
          <input value={newCat} onChange={e=>{setNewCat(e.target.value.toUpperCase());setErr("");}} onKeyDown={onKey} placeholder="New category name" style={box}/>
          {cats.length>0&&<Btn K={K} variant="ghost" onClick={()=>{setMakingCat(false);setNewCat("");}} style={{whiteSpace:"nowrap"}}>Pick existing</Btn>}</div>)}
        {code&&<div style={{fontSize:11,color:K.td,marginTop:6}}>Item code will be <strong style={{color:K.ac}}>{code}</strong> (automatic)</div>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:mode==="entry"?"64px minmax(0,1fr) minmax(0,1fr)":"minmax(0,1fr) minmax(0,1fr)",gap:8,marginTop:14}}>
        {mode==="entry"&&<div style={{minWidth:0}}><label style={lab}>Qty</label>
          <input inputMode="numeric" value={qty} onChange={e=>setQty(onlyInt(e.target.value))} onKeyDown={onKey} onFocus={e=>e.target.select()} style={{...box,textAlign:"center",padding:"12px 4px"}}/></div>}
        <div style={{minWidth:0}}><label style={lab}>{mode==="entry"?"Rate":"Purchase cost"}</label>{money(rate,setRate,mode==="entry"?"rate":"optional")}</div>
        <div style={{minWidth:0}}><label style={{...lab,color:K.ac}}>Sell price</label>{money(sell,setSell,"optional",true)}</div>
      </div>
      {markup!=null&&<div style={{fontSize:12,color:markup>=0?K.su:K.dn,marginTop:6,fontWeight:600}}>Markup {markup}% · profit {fmt(num(sell)-num(rate))} / pc</div>}

      <div style={{marginTop:14}}>
        <label style={lab}>Rack <span style={{textTransform:"none",letterSpacing:0,fontWeight:500,color:K.td}}>(optional)</span></label>
        <input value={rack} onChange={e=>setRack(e.target.value)} onKeyDown={onKey} placeholder="e.g. C12" style={box}/></div>

      {err&&<div style={{marginTop:12,background:K.dn+"18",border:"1px solid "+K.dn+"66",color:K.dn,borderRadius:10,padding:"10px 12px",fontSize:12.5,lineHeight:1.45}}>{err}</div>}
      {done.length>0&&<div style={{marginTop:12,fontSize:12,color:K.su}}>{"✓"} Added: {done.join(", ")}</div>}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>
        <Btn K={K} variant="ghost" onClick={()=>submit(true)} style={{padding:"13px 10px"}}>Add + another</Btn>
        <Btn K={K} onClick={()=>submit(false)} style={{padding:"13px 10px",fontSize:14}}>{exact&&dupOk?"Add anyway":"Add item"}</Btn></div>
    </div></div>);
}

/* ===== one sell-rate row (memoised: typing in one row doesn't redraw 400 others) ===== */

/* sell-rate maths, shared */
function recalcRow(r,field,v){
  r={...r,[field]:v};const net=num(r.cost)+num(r.extra);
  if(field==="pct"){if(net>0&&v!=="")r.sell=numStr(net*(1+num(v)/100));}
  else if(field==="sell"){if(net>0)r.pct=v===""?"":numStr((num(v)/net-1)*100);}
  else{ // cost or extra changed
    if(r.pct!==""&&r.pct!=null){if(net>0)r.sell=numStr(net*(1+num(r.pct)/100));}
    else if(r.sell!==""&&r.sell!=null){if(net>0)r.pct=numStr((num(r.sell)/net-1)*100);}
  }
  return r;
}

  return(<div style={{minHeight:"100vh",background:K.bg,color:K.tx,fontFamily:"'Montserrat',sans-serif",paddingBottom:30}}>
    {confirm&&<Confirm K={K} msg={confirm.msg} onYes={confirm.action} onNo={()=>setConfirm(null)}/>}
    {detail&&<ItemDetail K={K} detail={detail} purchases={purchases} onClose={()=>setDetail(null)}/>}
    <Toast K={K} msg={toast}/>

    {/* HEADER */}
    <div style={{position:"sticky",top:0,zIndex:50,background:K.sf,borderBottom:"1px solid "+K.bd,padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span className="serif" style={{fontSize:24,fontWeight:700,letterSpacing:"0.04em",color:K.ac}}>AMAZZA</span>
        <span style={{width:1,height:20,background:K.bd}}/>
        <div><div style={{fontSize:13,fontWeight:600,color:K.tm}}>Purchase Tracker</div>
        <div style={{fontSize:10,color:K.td}}>{totalP} catalogue items · {purchases.length} purchases</div></div>
      </div>
      <div className="topnav" style={{display:"flex",gap:8,alignItems:"center"}}>
        {navBtn("entry","Entry")}{navBtn("report","Report")}{navBtn("sales","Sell Rates")}{navBtn("profit","Profit")}{navBtn("history","History")}
        <button onClick={toggleTheme} title="Theme" style={{width:38,height:38,borderRadius:10,border:"1px solid "+K.bd,background:K.cd,color:K.tx,cursor:"pointer",fontSize:16}}>{theme==="dark"?"\u263E":"\u2600"}</button>
        <button onClick={()=>setShowBackup(true)} title="Backup" style={{width:38,height:38,borderRadius:10,border:"1px solid "+K.bd,background:K.cd,color:K.tx,cursor:"pointer",fontSize:18}}>{"\u22EF"}</button>
      </div>
    </div>

    <div style={{maxWidth:1200,margin:"0 auto",padding:"18px 16px"}}>

    {/* ================= ENTRY ================= */}
    {view==="entry"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>{editingId?"Edit Purchase":"New Purchase"}</h2>
        {editingId&&<Btn K={K} variant="ghost" onClick={resetWorking}>{"\u002B"} Start fresh</Btn>}
      </div>
      <div className="row-fields" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:18}}>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:10,fontWeight:600,color:K.tm,letterSpacing:"0.1em",textTransform:"uppercase"}}>Date</label>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setPDate(shiftISO(pDate,-1))} title="Previous day" style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,cursor:"pointer",padding:"0 11px",fontSize:13,fontFamily:"inherit"}}>{"\u25C0"}</button>
            <input type="date" value={pDate} onChange={e=>setPDate(e.target.value)} onClick={e=>{try{e.target.showPicker&&e.target.showPicker();}catch(_){}}}
              style={{flex:1,minWidth:0,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"10px 12px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",colorScheme:theme,cursor:"pointer"}}
              onFocus={e=>e.target.style.borderColor=K.ac} onBlur={e=>e.target.style.borderColor=K.bd}/>
            <button onClick={()=>setPDate(shiftISO(pDate,1))} title="Next day" style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,cursor:"pointer",padding:"0 11px",fontSize:13,fontFamily:"inherit"}}>{"\u25B6"}</button>
          </div>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <button onClick={()=>setPDate(todayISO())} style={{background:"none",border:"none",color:K.ac,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",padding:0}}>Today</button>
            <button onClick={()=>setPDate(shiftISO(todayISO(),-1))} style={{background:"none",border:"none",color:K.tm,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",padding:0}}>Yesterday</button>
            <span style={{fontSize:11,color:K.td,marginLeft:"auto"}}>{dispDate(pDate)}</span>
          </div>
        </div>
        <Field K={K} label="Vendor / Supplier" value={pVendor} onChange={setPVendor} placeholder="e.g. Morbi Traders"/>
        <Field K={K} label="Bill / Invoice No" value={pBillNo} onChange={setPBillNo} placeholder="optional"/>
      </div>

      <div className="main-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"start"}}>
        {/* LEFT — catalogue browser */}
        <div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,padding:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:K.tm}}>Catalogue</span>
            <div style={{display:"flex",gap:6}}>
              <Btn K={K} variant="ghost" onClick={()=>setShowMgr(true)} style={{padding:"7px 12px",fontSize:12}}>Edit items</Btn>
              <Btn K={K} onClick={()=>openNewItem("entry",gSearch.trim())} style={{padding:"7px 14px",fontSize:12.5}}>{"\u002B"} New item</Btn>
            </div>
          </div>
          <input value={gSearch} onChange={e=>setGSearch(e.target.value)} placeholder={"\uD83D\uDD0D  Search all "+totalP+" items..."} style={{width:"100%",boxSizing:"border-box",background:K.ag,border:"1.5px solid "+K.ac+"55",borderRadius:10,padding:"11px 14px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:10}}/>
          {!gSearch.trim()&&(<div style={{display:"flex",gap:8,marginBottom:10}}>
            <select value={selCat} onChange={e=>setSelCat(e.target.value)} style={{flex:1,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}>
              {Object.keys(catalog).map(c=><option key={c} value={c}>{c} ({catalog[c].length})</option>)}</select>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="filter..." style={{width:120,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none"}}/>
          </div>)}
          <div className="prod-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,maxHeight:"56vh",overflowY:"auto",paddingRight:2}}>
            {filtered.map(p=>{const inCart=lineQty[p.id]||0;const last=stats[p.id];return(
              <button key={p.id} onClick={()=>addLine(p)} style={{textAlign:"left",background:inCart?K.ag:K.bg,border:"1px solid "+(inCart?K.ac:K.bd),borderRadius:10,padding:"9px 10px",cursor:"pointer",position:"relative",fontFamily:"inherit",color:K.tx,transition:"border-color .15s"}}>
                {inCart>0&&<span style={{position:"absolute",top:6,right:6,background:K.ac,color:"#111",fontSize:10,fontWeight:800,borderRadius:20,minWidth:18,height:18,display:"grid",placeItems:"center",padding:"0 5px"}}>{inCart}</span>}
                <div style={{fontSize:12,fontWeight:600,lineHeight:1.25,paddingRight:18}}>{p.name}</div>
                <div style={{fontSize:9.5,color:K.td,marginTop:4}}>{p.id}{p.rack?" · "+p.rack:""}{gSearch.trim()?" · "+p._cat:""}</div>
                <div style={{fontSize:10,color:K.tm,marginTop:3}}>{last?"last "+fmt(last.lastRate):<span style={{color:K.td}}>sell {fmt(p.price)}</span>}</div>
              </button>);})}
            {filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:K.tm,padding:"22px 10px",fontSize:13}}>
              {(gSearch.trim()||search.trim())?<React.Fragment>No item called <strong style={{color:K.tx}}>{"\u201C"+(gSearch.trim()||search.trim())+"\u201D"}</strong>.<br/>
                <Btn K={K} onClick={()=>openNewItem("entry",gSearch.trim()||search.trim())} style={{marginTop:12}}>{"\u002B"} Add it as a new item</Btn></React.Fragment>
              :<React.Fragment>This category is empty.<br/><Btn K={K} onClick={()=>openNewItem("entry")} style={{marginTop:12}}>{"\u002B"} New item</Btn></React.Fragment>}
            </div>}
          </div>
          {filtered.length>0&&<button onClick={()=>openNewItem("entry",gSearch.trim())} style={{width:"100%",marginTop:10,background:"transparent",border:"1.5px dashed "+K.ac+"88",borderRadius:10,color:K.ac,padding:"11px",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>{"\u002B"} Can't find it? Add a new item</button>}
        </div>

        {/* RIGHT — current purchase */}
        <div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,padding:14,position:"sticky",top:78}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:K.tm,marginBottom:10}}>This Purchase {lines.length>0&&"· "+lines.length+" items"}</div>
          <div style={{maxHeight:"44vh",overflowY:"auto",marginBottom:10}}>
            {lines.length===0?(<div style={{textAlign:"center",color:K.tm,padding:"34px 10px",fontSize:13}}><div style={{fontSize:34,opacity:.4,marginBottom:6}}>{"\uD83D\uDED2"}</div>Tap items in the catalogue to add them here.</div>):
            lines.map((l,idx)=>{const last=stats[l.code];return(
              <div key={idx} style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:10,padding:10,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:8}}>
                  <div style={{minWidth:0}}><div style={{fontSize:13,fontWeight:600}}>{l.name}</div>
                    <div style={{fontSize:10,color:K.td,marginTop:1}}>{l.code}{l.rack?" · "+l.rack:""}{last?" · last "+fmt(last.lastRate):""}</div></div>
                  <button onClick={()=>removeLine(idx)} style={{background:"none",border:"none",color:K.dn,fontSize:16,cursor:"pointer",lineHeight:1}}>{"\u2715"}</button></div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{display:"flex",alignItems:"center",background:K.sf,borderRadius:8,border:"1px solid "+K.bd}}>
                    <button onClick={()=>updateLine(idx,"qty",l.qty-1)} style={{background:"none",border:"none",color:K.tm,cursor:"pointer",padding:"5px 10px",fontSize:15,fontFamily:"inherit"}}>{"\u2212"}</button>
                    <input type="text" inputMode="numeric" value={l.qty} onChange={e=>updateLine(idx,"qty",onlyInt(e.target.value))} onFocus={e=>e.target.select()} style={{width:38,textAlign:"center",background:"transparent",border:"none",color:K.tx,fontSize:13,fontWeight:600,fontFamily:"inherit",outline:"none"}}/>
                    <button onClick={()=>updateLine(idx,"qty",l.qty+1)} style={{background:"none",border:"none",color:K.tm,cursor:"pointer",padding:"5px 10px",fontSize:15,fontFamily:"inherit"}}>{"\u002B"}</button></div>
                  <span style={{color:K.td,fontSize:12}}>{"\u00D7"}</span>
                  <div style={{display:"flex",alignItems:"center",gap:4,background:K.sf,border:"1px solid "+K.bd,borderRadius:8,padding:"0 8px"}}>
                    <span style={{color:K.tm,fontSize:12}}>{"\u20B9"}</span>
                    <input type="text" inputMode="decimal" value={l.rate} onChange={e=>updateLine(idx,"rate",onlyDec(e.target.value))} onFocus={e=>e.target.select()} placeholder="rate" style={{width:64,background:"transparent",border:"none",color:K.tx,fontSize:13,fontFamily:"inherit",textAlign:"right",outline:"none",padding:"7px 0"}}/></div>
                  <span style={{marginLeft:"auto",fontWeight:700,fontSize:14,color:K.ac}}>{fmt(l.qty*(parseFloat(l.rate)||0))}</span></div>
                <input value={l.desc} onChange={e=>updateLine(idx,"desc",e.target.value)} placeholder="+ description (optional)" style={{width:"100%",boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:7,padding:"6px 9px",color:K.tm,fontSize:11,fontFamily:"inherit",outline:"none",fontStyle:"italic",marginTop:8}}/>
              </div>);})}
          </div>


          <input value={pNote} onChange={e=>setPNote(e.target.value)} placeholder="Note for this purchase (optional)" style={{width:"100%",boxSizing:"border-box",background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"9px 12px",color:K.tx,fontSize:12,fontFamily:"inherit",outline:"none",marginBottom:10}}/>

          <div style={{background:K.cd,borderRadius:12,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:K.tm,padding:"2px 0"}}><span>Total quantity</span><span style={{color:K.tx}}>{totalQty} pc</span></div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0 2px",borderTop:"1px solid "+K.bd,marginTop:6}}>
              <span className="serif" style={{fontSize:18,fontWeight:600}}>Purchase Total</span>
              <span className="serif" style={{fontSize:24,fontWeight:700,color:K.ac}}>{fmt(subtotal)}</span></div>
          </div>
          <Btn K={K} onClick={savePurchase} disabled={lines.length===0} style={{width:"100%",marginTop:10,padding:"13px",fontSize:14}}>{editingId?"Update Purchase":"Save Purchase"}</Btn>
          <Btn K={K} variant="ghost" onClick={()=>printPurchase({date:pDate,vendor:pVendor,billNo:pBillNo,note:pNote,items:lines})} disabled={lines.length===0} style={{width:"100%",marginTop:8,padding:"12px",fontSize:13}}>{"\u2B07"} Generate PDF / Print</Btn>
        </div>
      </div>
    </div>)}

    {/* ================= REPORT ================= */}
    {view==="report"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>Average Cost Report</h2>
        <Btn K={K} variant="ghost" onClick={exportReport} style={{padding:"9px 16px",fontSize:13}}>{"\u2B07"} Export Excel</Btn>
      </div>
      <p style={{fontSize:12,color:K.tm,marginBottom:14}}>Weighted average purchase cost per item, across every recorded purchase.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
        {[["Items Purchased",Object.keys(stats).length],["Total Purchases",purchases.length],["Total Spend",fmt(grandSpend)]].map((s,i)=>(
          <div key={i} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:14,padding:"14px 16px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:K.ac,opacity:.7}}/>
            <div className="serif" style={{fontSize:26,fontWeight:700,color:K.ac,lineHeight:1}}>{s[1]}</div>
            <div style={{fontSize:9.5,letterSpacing:".12em",textTransform:"uppercase",color:K.tm,marginTop:5}}>{s[0]}</div></div>))}</div>
      <input value={repSearch} onChange={e=>setRepSearch(e.target.value)} placeholder={"\uD83D\uDD0D  Search report..."} style={{width:"100%",boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:12,padding:"12px 15px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:14}}/>
      <div style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:14,overflow:"hidden",overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:560}}>
          <thead><tr>{[["name","Item"],["qty","Qty"],["avg","Avg Cost"],["lastRate","Last"],["val","Spend"],["count","Buys"]].map(h=>(
            <th key={h[0]} onClick={()=>setRepSort(s=>s.k===h[0]?{k:h[0],d:-s.d}:{k:h[0],d:1})} style={{background:K.cd,padding:"11px 12px",textAlign:h[0]==="name"?"left":"right",fontSize:10,letterSpacing:".08em",textTransform:"uppercase",color:K.tm,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{h[1]} {repSort.k===h[0]?(repSort.d===1?"\u25B2":"\u25BC"):""}</th>))}</tr></thead>
          <tbody>
            {repRows.map(r=>(<tr key={r.code} onClick={()=>setDetail(r)} style={{borderTop:"1px solid "+K.bd,cursor:"pointer"}}>
              <td style={{padding:"11px 12px"}}><div style={{fontWeight:600}}>{r.name}</div><div style={{fontSize:10,color:K.td,marginTop:2}}>{r.cat}{r.rack?" · "+r.rack:""}</div></td>
              <td style={{padding:"11px 12px",textAlign:"right"}}>{r.qty}</td>
              <td style={{padding:"11px 12px",textAlign:"right",fontWeight:700,color:K.ac}}>{fmt(r.avg)}</td>
              <td style={{padding:"11px 12px",textAlign:"right",color:K.tm}}>{fmt(r.lastRate)}</td>
              <td style={{padding:"11px 12px",textAlign:"right"}}>{fmt(r.val)}</td>
              <td style={{padding:"11px 12px",textAlign:"right",color:K.tm}}>{r.count}</td></tr>))}
            {repRows.length===0&&<tr><td colSpan={6} style={{padding:34,textAlign:"center",color:K.tm}}>No purchases recorded yet. Add one from the Entry tab.</td></tr>}
          </tbody></table></div>
      <p style={{fontSize:11,color:K.td,marginTop:10}}>Tap any row to see that item's full purchase history.</p>
    </div>)}

    {/* ================= SELL RATES (auto-filled from the catalogue) ================= */}
    {view==="sales"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>Sell Rates</h2>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn K={K} variant="ghost" onClick={exportSales} style={{padding:"9px 14px",fontSize:13}}>{"⬇"} Export Excel</Btn>
          <Btn K={K} onClick={()=>openNewItem("sales",salesSearch.trim())} style={{padding:"9px 14px",fontSize:13}}>{"+"} New item</Btn>
        </div>
      </div>
      <p style={{fontSize:12,color:K.tm,marginBottom:14,lineHeight:1.55}}>Every catalogue item is listed here automatically, including new ones the moment you add them. Cost fills in from your average purchase cost. Type a <strong>markup %</strong> or a <strong>selling price</strong>; each fills the other. Tap an item's name to rename it.</p>

      {/* show chips */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        {[["all","All",salesCounts.all],["unpriced","Not priced",salesCounts.unpriced],["priced","Priced",salesCounts.priced],["bought","Purchased",salesCounts.bought]].map(([k,l,n])=>(
          <button key={k} onClick={()=>setSalesShow(k)} style={{background:salesShow===k?K.ag:K.sf,border:"1px solid "+(salesShow===k?K.ac:K.bd),color:salesShow===k?K.ac:K.tm,borderRadius:20,padding:"7px 13px",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>{l} <span style={{opacity:.75,fontWeight:600}}>{n}</span></button>))}
      </div>

      {/* toolbar */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <input value={salesSearch} onChange={e=>setSalesSearch(e.target.value)} placeholder={"🔍  Search items..."} style={{flex:"1 1 200px",minWidth:160,boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:12,padding:"11px 14px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
        {salesCats.length>0&&<select value={salesCatFilter} onChange={e=>setSalesCatFilter(e.target.value)} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"10px 10px",outline:"none",maxWidth:190}}>
          <option value="">All categories</option>{salesCats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>}
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.tm}}>Sort</span>
          <select value={salesSort.k} onChange={e=>setSalesSort(s=>({k:e.target.value,d:s.d}))} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"10px 10px",outline:"none"}}>
            <option value="name">Name</option><option value="pct">Markup %</option><option value="sell">Selling price</option><option value="net">Net rate</option><option value="cost">Cost</option><option value="profit">Profit / pc</option>
          </select>
          <button onClick={()=>setSalesSort(s=>({k:s.k,d:-s.d}))} title="Toggle ascending / descending" style={{background:K.cd,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,cursor:"pointer",padding:"10px 12px",fontSize:13,fontFamily:"inherit"}}>{salesSort.d===1?"▲":"▼"}</button>
        </div>
      </div>

      <div style={{fontSize:11,color:K.td,marginBottom:10}}>{salesView.length} item{salesView.length!==1?"s":""} shown{salesAvgMarkup!=null?" · avg markup "+salesAvgMarkup+"%":""}</div>

      {salesView.length===0?(<div style={{textAlign:"center",color:K.tm,padding:"36px 16px",fontSize:13,background:K.sf,border:"1px dashed "+K.bd,borderRadius:16}}>
        {salesSearch.trim()?<React.Fragment>No item matches {"“"+salesSearch.trim()+"”"}.<br/><Btn K={K} onClick={()=>openNewItem("sales",salesSearch.trim())} style={{marginTop:12}}>{"+"} Add it as a new item</Btn><br/></React.Fragment>:"Nothing to show here. "}
        {(salesSearch.trim()||salesCatFilter||salesShow!=="all")&&<span onClick={()=>{setSalesSearch("");setSalesCatFilter("");setSalesShow("all");}} style={{color:K.ac,cursor:"pointer",textDecoration:"underline",display:"inline-block",marginTop:10}}>Clear filters</span>}</div>):
      (<div style={{display:"flex",flexDirection:"column",gap:10}}>
        {salesView.slice(0,salesLimit).map(r=>(
          <SalesRow key={r.code} K={K} r={r} avg={stats[r.code]?stats[r.code].avg:0} inCatalog={!!catItem[r.code]} moveTargets={catNames}
            onField={onSalesField} onUseAvg={onUseAvg} onMove={onMoveRow} onClear={onClearRow} onRemove={onRemoveRow} onRename={onRenameRow}/>))}
        {salesView.length>salesLimit&&<Btn K={K} variant="ghost" onClick={()=>setSalesLimit(l=>l+100)} style={{width:"100%",padding:"13px"}}>Show more ({salesView.length-salesLimit} left)</Btn>}
      </div>)}
    </div>)}
    {/* ================= MONTHLY PROFIT ================= */}
    {view==="profit"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>Monthly Profit</h2>
        <Btn K={K} variant="ghost" onClick={exportProfit} style={{padding:"9px 14px",fontSize:13}}>{"\u2B07"} Export Excel</Btn>
      </div>
      <p style={{fontSize:12,color:K.tm,marginBottom:14}}>Pick a month, then enter <strong>Qty sold</strong> and the <strong>average selling price</strong> for any item. Cost comes from the <strong>Net rate</strong> in Sell Rates (cost + extra expenses), so this is your <strong>net profit</strong>. If no net rate is set, the weighted average purchase price is used instead. You can override it per month. Items show here once they have a purchase, a cost or a selling price.</p>

      {/* month selector */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <button onClick={()=>setPfMonth(shiftMonth(pfMonth,-1))} title="Previous month" style={{background:K.cd,border:"1px solid "+K.bd,borderRadius:10,color:K.tx,cursor:"pointer",padding:"9px 14px",fontSize:13,fontFamily:"inherit"}}>{"\u25C0"}</button>
        <span className="serif" style={{fontSize:20,fontWeight:700,color:K.ac,minWidth:150,textAlign:"center"}}>{monthLabel(pfMonth)}</span>
        <button onClick={()=>setPfMonth(shiftMonth(pfMonth,1))} title="Next month" style={{background:K.cd,border:"1px solid "+K.bd,borderRadius:10,color:K.tx,cursor:"pointer",padding:"9px 14px",fontSize:13,fontFamily:"inherit"}}>{"\u25B6"}</button>
        {pfMonth!==monthISO()&&<button onClick={()=>setPfMonth(monthISO())} style={{background:"none",border:"none",color:K.ac,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>This month</button>}
      </div>

      {/* summary cards */}
      <div className="pf-cards" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:16}}>
        {[["Total Profit",fmt(pfTotals.profit),pfTotals.profit>0?K.su:pfTotals.profit<0?K.dn:K.ac],["Revenue",fmt(pfTotals.rev),K.ac],["Profit %",round2(pfTotals.pct)+"%",pfTotals.profit>0?K.su:pfTotals.profit<0?K.dn:K.ac],["Items Sold",pfTotals.items+" · "+pfTotals.pcs+" pc",K.ac]].map((s,i)=>(
          <div key={i} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:14,padding:"14px 16px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:s[2],opacity:.7}}/>
            <div className="serif" style={{fontSize:22,fontWeight:700,color:s[2],lineHeight:1,whiteSpace:"nowrap"}}>{s[1]}</div>
            <div style={{fontSize:9.5,letterSpacing:".12em",textTransform:"uppercase",color:K.tm,marginTop:5}}>{s[0]}</div></div>))}</div>

      {/* toolbar */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <input value={pfSearch} onChange={e=>setPfSearch(e.target.value)} placeholder={"\uD83D\uDD0D  Search items..."} style={{flex:"1 1 200px",minWidth:160,boxSizing:"border-box",background:K.sf,border:"1px solid "+K.bd,borderRadius:12,padding:"11px 14px",color:K.tx,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
        {pfCats.length>0&&<select value={pfCat} onChange={e=>setPfCat(e.target.value)} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"9px 10px",outline:"none",maxWidth:180}}>
          <option value="">All categories</option>{pfCats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>}
        <button onClick={()=>setPfOnly(o=>!o)} style={{background:pfOnly?K.ag:K.cd,border:"1px solid "+(pfOnly?K.ac:K.bd),borderRadius:9,color:pfOnly?K.ac:K.tm,cursor:"pointer",padding:"9px 13px",fontSize:12.5,fontWeight:600,fontFamily:"inherit"}}>{pfOnly?"\u2713 ":""}Entered only</button>
      </div>

      {pfRows.length===0?(<div style={{textAlign:"center",color:K.tm,padding:"46px 16px",fontSize:13,background:K.sf,border:"1px dashed "+K.bd,borderRadius:16}}>
        {pfBase.length===0?"No items with purchase data yet. Record purchases first — cost prices come from there.":"No items match. "}{pfBase.length>0&&<span onClick={()=>{setPfSearch("");setPfCat("");setPfOnly(false);}} style={{color:K.ac,cursor:"pointer",textDecoration:"underline"}}>Clear filters</span>}
      </div>):(
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {pfRows.map(r=>{const q=num(r.e.qty);const s=num(r.e.sell);const hasSale=q>0&&s>0;return(
          <div key={r.code} style={{background:K.sf,border:"1px solid "+(r.entered?K.ac+"66":K.bd),borderRadius:14,padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:10}}>
              <div style={{minWidth:0}}><div style={{fontSize:14,fontWeight:700}}>{r.name}</div>
                <div style={{fontSize:10,color:K.td,marginTop:2}}>{r.cat}{r.rack?" · "+r.rack:""} · {r.code}</div></div>
              {r.entered&&<button title="Clear this month's entry" onClick={()=>{const d={...profitData};const m={...(d[pfMonth]||{})};delete m[r.code];d[pfMonth]=m;saveProfit(d);}} style={{background:"none",border:"none",color:K.dn,fontSize:15,cursor:"pointer",lineHeight:1}}>{"\u2715"}</button>}
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:80}}>
                <label style={{fontSize:9,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.ac}}>Qty sold</label>
                <div style={{display:"flex",alignItems:"center",background:K.bg,border:"1px solid "+K.ac+"66",borderRadius:8,padding:"0 8px"}}>
                  <input inputMode="numeric" value={r.e.qty||""} onChange={e=>setPf(r.code,"qty",e.target.value)} onFocus={e=>e.target.select()} placeholder="0" style={{width:52,background:"transparent",border:"none",color:K.tx,fontSize:13,fontWeight:600,fontFamily:"inherit",textAlign:"right",outline:"none",padding:"8px 0"}}/>
                  <span style={{color:K.tm,fontSize:11,marginLeft:3}}>pc</span></div>
              </div>
              <span style={{color:K.td,fontSize:14,paddingBottom:11}}>{"\u00D7"}</span>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:96}}>
                <label style={{fontSize:9,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.ac}}>Avg sell ₹</label>
                <div style={{display:"flex",alignItems:"center",gap:3,background:K.bg,border:"1px solid "+K.ac+"66",borderRadius:8,padding:"0 8px"}}>
                  <span style={{color:K.tm,fontSize:12}}>{"\u20B9"}</span>
                  <input inputMode="decimal" value={r.e.sell||""} onChange={e=>setPf(r.code,"sell",e.target.value)} onFocus={e=>e.target.select()} placeholder="0" style={{width:62,background:"transparent",border:"none",color:K.tx,fontSize:13,fontWeight:600,fontFamily:"inherit",textAlign:"right",outline:"none",padding:"8px 0"}}/></div>
              </div>
              <span style={{color:K.td,fontSize:14,paddingBottom:11}}>{"\u2212"}</span>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:96}}>
                <label style={{fontSize:9,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.tm}}>Net cost ₹</label>
                <div style={{display:"flex",alignItems:"center",gap:3,background:K.bg,border:"1px solid "+K.bd,borderRadius:8,padding:"0 8px"}}>
                  <span style={{color:K.tm,fontSize:12}}>{"\u20B9"}</span>
                  <input inputMode="decimal" value={(r.e.cost!=null&&r.e.cost!=="")?r.e.cost:""} onChange={e=>setPf(r.code,"cost",e.target.value)} onFocus={e=>e.target.select()} placeholder={r.def>0?numStr(r.def):"0"} style={{width:60,background:"transparent",border:"none",color:K.tx,fontSize:13,fontFamily:"inherit",textAlign:"right",outline:"none",padding:"8px 0"}}/></div>
                <span style={{fontSize:9,color:K.td}}>{r.net>0?"net rate "+fmt(r.net):r.avg>0?"purchase avg "+fmt(r.avg)+" (no net rate set)":"no cost data"}</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:96,marginLeft:"auto"}}>
                <label style={{fontSize:9,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.tm}}>Profit {"\u20B9"}</label>
                <div style={{fontSize:15,fontWeight:700,textAlign:"right",paddingTop:6,color:hasSale?(r.totalProfit>0?K.su:r.totalProfit<0?K.dn:K.tm):K.td}}>{hasSale?fmt(r.totalProfit):"\u2014"}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:70}}>
                <label style={{fontSize:9,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:K.tm}}>Profit %</label>
                <div style={{fontSize:15,fontWeight:700,textAlign:"right",paddingTop:6,color:hasSale?(r.pfPct>0?K.su:r.pfPct<0?K.dn:K.tm):K.td}}>{hasSale?round2(r.pfPct)+"%":"\u2014"}</div>
              </div>
            </div>
          </div>);})}
      </div>)}
      <p style={{fontSize:11,color:K.td,marginTop:12}}>Profit % is on cost (markup basis). Each month keeps its own entries — use {"\u25C0"} {"\u25B6"} to switch. Items you've filled in rise to the top.</p>
    </div>)}

    {/* ================= HISTORY ================= */}
    {view==="history"&&(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <h2 className="serif" style={{fontSize:24,fontWeight:600}}>Purchase History</h2>
        {monthGroups.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn K={K} onClick={exportAllPdfZip} disabled={zipBusy} style={{padding:"7px 13px",fontSize:12}}>{zipBusy?(zipMsg||"Working\u2026"):"\u2B07 Download all PDFs (ZIP)"}</Btn>
          <Btn K={K} variant="ghost" onClick={expandAll} style={{padding:"7px 13px",fontSize:12}}>Expand all</Btn>
          <Btn K={K} variant="ghost" onClick={collapseAll} style={{padding:"7px 13px",fontSize:12}}>Collapse all</Btn>
        </div>}
      </div>
      {zipBusy&&<div style={{background:K.cd,border:"1px solid "+K.bd,borderRadius:12,padding:"12px 16px",marginBottom:14,fontSize:12,color:K.tm}}>{zipMsg||"Working\u2026"} \u2014 keep this screen open.</div>}
      {purchases.length===0?<div style={{textAlign:"center",color:K.tm,padding:40,fontSize:13}}>No purchases yet.</div>:
      monthGroups.map((g,gi)=>{const open=isOpen(g.key,gi);return(
        <div key={g.key} style={{marginBottom:12}}>
          <button onClick={()=>toggleMonth(g.key,gi)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,background:K.cd,border:"1px solid "+(open?K.ac:K.bd),borderRadius:12,padding:"13px 16px",cursor:"pointer",fontFamily:"inherit",color:K.tx,textAlign:"left"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flexWrap:"wrap"}}>
              <span style={{color:K.ac,fontSize:12,display:"inline-block",transition:"transform .2s",transform:open?"rotate(90deg)":"rotate(0deg)"}}>{"\u25B6"}</span>
              <span className="serif" style={{fontSize:18,fontWeight:700}}>{g.label}</span>
              <span style={{fontSize:11,color:K.tm}}>{g.count} purchase{g.count!==1?"s":""} · {g.pc} pc</span>
            </div>
            <span className="serif" style={{fontSize:18,fontWeight:700,color:K.ac,whiteSpace:"nowrap"}}>{fmt(g.total)}</span>
          </button>
          {open&&<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:10}}>
            {g.items.map(p=>(<div key={p.id} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:14,padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                <div><div style={{fontSize:14,fontWeight:700}}>{p.vendor||"Unnamed vendor"}{p.billNo?<span style={{color:K.tm,fontWeight:400}}>{"  ·  #"+p.billNo}</span>:null}</div>
                  <div style={{fontSize:11,color:K.tm,marginTop:2}}>{dispDate(p.date)} · {(p.items||[]).length} items · {(p.items||[]).reduce((s,i)=>s+(Number(i.qty)||0),0)} pc</div>
                  {p.note?<div style={{fontSize:11,color:K.td,fontStyle:"italic",marginTop:3}}>{p.note}</div>:null}</div>
                <div style={{textAlign:"right"}}><div className="serif" style={{fontSize:22,fontWeight:700,color:K.ac}}>{fmt(p.total)}</div></div></div>
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <Btn K={K} variant="ghost" onClick={()=>printPurchase(p)} style={{padding:"7px 14px",fontSize:12}}>{"\u2B07"} PDF</Btn>
                <Btn K={K} variant="ghost" onClick={()=>loadPurchase(p)} style={{padding:"7px 14px",fontSize:12}}>Edit</Btn>
                <Btn K={K} variant="danger" onClick={()=>deletePurchase(p)} style={{padding:"7px 14px",fontSize:12}}>Delete</Btn></div>
            </div>))}
          </div>}
        </div>);})}
    </div>)}

    </div>

    {/* ====== ITEMS MANAGER (edit / move / remove; adding goes through the New Item form) ====== */}
    {showMgr&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9997,padding:16}} onClick={()=>{setShowMgr(false);setEditId(null);}}>
      <div onClick={e=>e.stopPropagation()} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,width:"100%",maxWidth:660,maxHeight:"90vh",display:"flex",flexDirection:"column",padding:18,animation:"slideUp .25s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:10}}>
          <h3 className="serif" style={{fontSize:22,fontWeight:600}}>Items</h3>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <Btn K={K} onClick={()=>openNewItem("manage",mgrSearch.trim())} style={{padding:"8px 14px",fontSize:12.5}}>{"+"} New item</Btn>
            <button onClick={()=>{setShowMgr(false);setEditId(null);}} style={{background:"none",border:"none",color:K.tm,fontSize:20,cursor:"pointer"}}>{"✕"}</button></div></div>
        <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>
          <input value={mgrSearch} onChange={e=>setMgrSearch(e.target.value)} placeholder={"🔍  Search "+totalP+" items..."} style={{flex:"1 1 180px",background:K.bg,border:"1px solid "+K.bd,borderRadius:9,padding:"10px 12px",color:K.tx,fontSize:13.5,fontFamily:"inherit",outline:"none"}}/>
          <select value={mgrCat} onChange={e=>{setMgrCat(e.target.value);setEditId(null);}} style={{flex:"0 1 220px",background:K.bg,border:"1px solid "+K.bd,borderRadius:9,color:K.tx,fontFamily:"inherit",fontSize:13,padding:"10px",outline:"none"}}>
            <option value="">All categories</option>{catNames.map(c=><option key={c} value={c}>{c} ({catalog[c].length})</option>)}</select>
        </div>
        {mgrCat&&<div style={{display:"flex",gap:8,marginBottom:8}}>
          <Btn K={K} variant="ghost" onClick={()=>renameCategory(mgrCat)} style={{fontSize:12,padding:"6px 12px"}}>Rename category</Btn>
          {catalog[mgrCat]&&catalog[mgrCat].length===0&&<Btn K={K} variant="danger" onClick={()=>removeCategory(mgrCat)} style={{fontSize:12,padding:"6px 12px"}}>Delete empty category</Btn>}
        </div>}
        <div style={{fontSize:11,color:K.td,marginBottom:4}}>{mgrRows.length} item{mgrRows.length!==1?"s":""}{" · "}tap {"✎"} to edit</div>
        <div style={{overflowY:"auto",flex:1,minHeight:120}}>
          {mgrRows.slice(0,250).map(p=>(<div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 4px",borderTop:"1px solid "+K.bd,flexWrap:editId===p.id?"wrap":"nowrap"}}>
            {editId===p.id?(<React.Fragment>
              <input value={editData.name} onChange={e=>setEditData({...editData,name:e.target.value.toUpperCase()})} placeholder="Name" style={{flex:"2 1 180px",background:K.bg,border:"1px solid "+K.ac,borderRadius:7,padding:"8px",color:K.tx,fontSize:12.5,fontFamily:"inherit",outline:"none"}}/>
              <input value={editData.rack} onChange={e=>setEditData({...editData,rack:e.target.value})} placeholder="Rack" style={{width:70,background:K.bg,border:"1px solid "+K.ac,borderRadius:7,padding:"8px",color:K.tx,fontSize:12.5,fontFamily:"inherit",outline:"none"}}/>
              <input value={editData.price} inputMode="decimal" onChange={e=>setEditData({...editData,price:onlyDec(e.target.value)})} placeholder="Sell ₹" style={{width:80,background:K.bg,border:"1px solid "+K.ac,borderRadius:7,padding:"8px",color:K.tx,fontSize:12.5,fontFamily:"inherit",outline:"none"}}/>
              <button onClick={saveEdit} style={{background:K.su,border:"none",color:"#fff",borderRadius:7,padding:"8px 12px",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Save</button>
              <button onClick={()=>setEditId(null)} style={{background:"none",border:"1px solid "+K.bd,color:K.tm,borderRadius:7,padding:"8px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
            </React.Fragment>):(<React.Fragment>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:600}}>{p.name}</div><div style={{fontSize:10,color:K.td}}>{p.id}{p.rack?" · "+p.rack:""}{!mgrCat?" · "+p._cat:""}{p.price?" · sell "+fmt(p.price):""}</div></div>
              <select onChange={e=>{if(e.target.value){moveItemTo(p.id,e.target.value);flash("Moved to "+e.target.value);e.target.value="";}}} value="" title="Move to category" style={{background:K.bg,border:"1px solid "+K.bd,borderRadius:6,color:K.tm,fontFamily:"inherit",fontSize:11,padding:"5px 4px",outline:"none",maxWidth:90}}>
                <option value="">move...</option>{catNames.filter(c=>c!==p._cat).map(c=><option key={c} value={c}>{c}</option>)}</select>
              <button onClick={()=>startEdit(p)} title="Edit" style={{background:"none",border:"none",color:K.tm,fontSize:15,cursor:"pointer",padding:"2px 4px"}}>{"✎"}</button>
              <button onClick={()=>removeItem(p)} title="Remove" style={{background:"none",border:"none",color:K.dn,fontSize:15,cursor:"pointer",padding:"2px 4px"}}>{"✕"}</button>
            </React.Fragment>)}
          </div>))}
          {mgrRows.length>250&&<div style={{fontSize:11,color:K.td,textAlign:"center",padding:10}}>Showing first 250. Search or pick a category to narrow down.</div>}
          {mgrRows.length===0&&<div style={{textAlign:"center",color:K.tm,padding:24,fontSize:13}}>No items found.{mgrSearch.trim()&&<React.Fragment><br/><Btn K={K} onClick={()=>openNewItem("manage",mgrSearch.trim())} style={{marginTop:10}}>{"+"} Add {"“"+mgrSearch.trim()+"”"}</Btn></React.Fragment>}</div>}
        </div>
        <Btn K={K} variant="ghost" onClick={()=>{setShowMgr(false);setEditId(null);}} style={{width:"100%",marginTop:12}}>Done</Btn>
      </div></div>)}

    {/* ====== NEW ITEM ====== */}
    {newItem&&<NewItemSheet K={K} catalog={catalog} mode={newItem.mode} initial={newItem}
      onCreate={d=>createItem(d,newItem.mode)} onPickExisting={p=>pickExisting(p,newItem.mode)} onClose={()=>setNewItem(null)}/>}
    {/* ====== BACKUP ====== */}
    {showBackup&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9997,padding:16}} onClick={()=>setShowBackup(false)}>
      <div onClick={e=>e.stopPropagation()} style={{background:K.sf,border:"1px solid "+K.bd,borderRadius:16,width:"100%",maxWidth:380,padding:22,animation:"slideUp .25s ease"}}>
        <h3 className="serif" style={{fontSize:22,fontWeight:600,marginBottom:4}}>Data & Backup</h3>
        <p style={{fontSize:12,color:K.tm,marginBottom:16}}>Everything saves on this device. Export regularly so you never lose it.</p>
        <Btn K={K} onClick={exportData} style={{width:"100%",marginBottom:8}}>{"\u2B07"} Export backup (.json)</Btn>
        <Btn K={K} variant="ghost" onClick={()=>document.getElementById("imp").click()} style={{width:"100%",marginBottom:8}}>{"\u2B06"} Import backup</Btn>
        <input id="imp" type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
        <Btn K={K} variant="ghost" onClick={downloadSnapshot} style={{width:"100%",marginBottom:8,fontSize:12}}>{"\u2B07"} Download pre-upgrade copy</Btn>
        <Btn K={K} variant="danger" onClick={wipeAll} style={{width:"100%",marginBottom:8}}>Erase all data</Btn>
        <Btn K={K} variant="ghost" onClick={()=>setShowBackup(false)} style={{width:"100%"}}>Close</Btn>
      </div></div>)}

  </div>);
}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
